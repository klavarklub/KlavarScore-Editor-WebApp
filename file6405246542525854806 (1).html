<script id="final-clean">
document.addEventListener('DOMContentLoaded', function(){
  let outerToggle = document.createElement('div');
  outerToggle.id='outer-edit-pan';
  outerToggle.innerHTML = '<button id="outer-edit-btn" class="active">Edit</button><span id="outer-hand-options"><button id="outer-hand-auto-btn" data-hand="Auto">Auto</button><button id="outer-hand-lh-btn" data-hand="LH">LH</button><button id="outer-hand-rh-btn" data-hand="RH">RH</button></span><span id="outer-select-indicator" style="display:none;align-items:center;padding:8px 10px;font-size:9px;color:rgba(0,0,0,0.6);flex-direction:column;line-height:1.05;">Select Mode<span style="font-size:13px;margin-top:2px;">Activated</span></span><button id="outer-pan-btn">Pan</button><button id="outer-playback-btn" title="Playback - baby step button">> Play</button><button id="outer-save-midi-btn" title="Save MIDI - baby step button">Save MIDI</button><button id="outer-new-page-btn" title="Add a new blank score page">New Page</button><button id="outer-delete-page-btn" title="Delete the last new score page">Delete Page</button><button id="outer-print-btn" title="Print the A4 score">Print A4</button>';
  document.body.appendChild(outerToggle);
  function applyHandToAllIframes(hand){
    document.querySelectorAll('#a4-sheet iframe, .a4-extra-page iframe').forEach(function(iframe){
      try{
        let doc=iframe.contentDocument; if(!doc) return;
        let btn=Array.from(doc.querySelectorAll('button')).find(function(b){ return (b.textContent||'').trim()===hand; });
        if(btn){
          try{ btn.click(); }catch(e){}
          let handRow=btn.parentElement && btn.parentElement.parentElement && btn.parentElement.parentElement.parentElement;
          if(handRow) handRow.style.display='none';
          let addNoteBtn=Array.from(doc.querySelectorAll('button')).find(function(b){ return (b.textContent||'').trim().startsWith('Add Note'); });
          if(addNoteBtn) { try{ if(!addNoteBtn.classList.contains('bg-black')) addNoteBtn.click(); }catch(e){} }
        }
      }catch(e){}
    });
    ['Auto','LH','RH'].forEach(function(h){
      let b=document.querySelector('[data-hand="'+h+'"]');
      if(b) b.classList.toggle('active', h===hand);
    });
  }
  document.querySelectorAll('[data-hand]').forEach(function(btn){
    btn.addEventListener('click',function(){ applyHandToAllIframes(btn.getAttribute('data-hand')); var ho=document.getElementById('outer-hand-options'); if(ho) ho.classList.remove('visible'); var si=document.getElementById('outer-select-indicator'); if(si) si.style.display='none'; });
  });
  let isPan = false;
  let panAutoTimer = null;
  let panFingerDown = false;
  function armPanAutoTimer(){
    if(panAutoTimer){ clearTimeout(panAutoTimer); panAutoTimer = null; }
  }
  document.addEventListener('touchstart', function(){
    if(!isPan) return;
    panFingerDown = true;
    if(panAutoTimer){ clearTimeout(panAutoTimer); panAutoTimer = null; }
  }, {passive:true});
  document.addEventListener('touchend', function(){
    panFingerDown = false;
    armPanAutoTimer();
  }, {passive:true});
  document.addEventListener('touchcancel', function(){
    panFingerDown = false;
    armPanAutoTimer();
  }, {passive:true});
  function applyModeToAllIframes(pan){
    document.querySelectorAll('#a4-sheet iframe, .a4-extra-page iframe').forEach(function(iframe){
      try{
        let doc = iframe.contentDocument; if(!doc) return;
        let innerBtns = doc.querySelectorAll('div.fixed.bottom-4.left-4 button');
        if(innerBtns.length>=2){
          let editBtn = innerBtns[0], panBtn = innerBtns[1];
          let innerIsPan = doc.body.classList.contains('pan-mode');
          // Check active markers if available
          if(innerBtns[1].classList.contains('active') || innerBtns[1].classList.contains('bg-black')) innerIsPan = true;
          if(innerBtns[0].classList.contains('active') || innerBtns[0].classList.contains('bg-black')) innerIsPan = false;
          if(pan && !innerIsPan){ try{ panBtn.click(); }catch(e){} }
          else if(!pan && innerIsPan){ try{ editBtn.click(); }catch(e){} }
        }
        doc.body.classList.toggle('pan-mode', pan);
        doc.body.classList.toggle('edit-mode', !pan);
      }catch(e){}
    });
  }
  function setMode(pan){
    if(panAutoTimer){ clearTimeout(panAutoTimer); panAutoTimer = null; }
    if(!pan) panFingerDown = false;
    isPan = pan;
    document.body.classList.toggle('pan-mode', pan);
    document.body.classList.toggle('edit-mode', !pan);
    let eb = document.getElementById('outer-edit-btn');
    let pb = document.getElementById('outer-pan-btn');
    if(eb && pb){ eb.classList.toggle('active', !pan); pb.classList.toggle('active', pan); }
    applyModeToAllIframes(pan);
    if(pan){
      setTimeout(syncPanToolbarOverlays,50);
      armPanAutoTimer();
    }else document.querySelectorAll('.pan-toolbar-overlay').forEach(function(el){el.remove();});
  }
  function keepToolbarInView(){
    let bar = document.getElementById('outer-edit-pan');
    if(!bar) return;
    let vv = window.visualViewport;
    if(!vv) return;

    let bw = bar.offsetWidth || 280;
    let bh = bar.offsetHeight || 44;

    /* Keep the top-right Save/Load/AI bar attached to the visual viewport. */
    let saveBar = document.getElementById('klavar-save-bar');
    if(saveBar){
      saveBar.style.setProperty('position','fixed','important');
      saveBar.style.setProperty('top',((vv.offsetTop || 0) + 18) + 'px','important');
      saveBar.style.setProperty('left',((vv.offsetLeft || 0) + vv.width - saveBar.offsetWidth - 18) + 'px','important');
      saveBar.style.setProperty('right','auto','important');
    }

    /*
      Anchor the bottom toolbar to whichever page frame is currently visible.
      This is important because Pan mode can move the score without producing
      a normal window scroll event.
    */
    let frames = [];
    let mainFrameHost = document.querySelector('#a4-sheet > div:last-child');
    if(mainFrameHost) frames.push(mainFrameHost);
    document.querySelectorAll('.a4-extra-page > div:last-child').forEach(function(el){
      frames.push(el);
    });

    let target = null;
    let viewportCenter = (vv.offsetLeft || 0) + vv.width / 2;
    let bestDist = Infinity;

    frames.forEach(function(frame){
      let fr = frame.getBoundingClientRect();
      if(fr.right < (vv.offsetLeft || 0) - 20 || fr.left > (vv.offsetLeft || 0) + vv.width + 20) return;
      let center = fr.left + fr.width / 2;
      let dist = Math.abs(center - viewportCenter);
      if(dist < bestDist){
        bestDist = dist;
        target = frame;
      }
    });

    if(target){
      let fr = target.getBoundingClientRect();

      /*
        Keep following the visible page, but clamp the toolbar to the
        visual viewport. During pinch-zoom the visual viewport can become
        much smaller than the layout viewport, so the page frame alone is

      let vvLeft = vv.offsetLeft || 0;
      let vvTop = vv.offsetTop || 0;
      let vvRight = vvLeft + vv.width;
      let vvBottom = vvTop + vv.height;

      let maxX = vvRight - bw - margin;
      let minY = vvTop + margin;
      let maxY = vvBottom - bh - margin;

      if(maxX < minX) x = vvLeft + Math.max(0,(vv.width-bw)/2);
      else x = Math.max(minX, Math.min(x, maxX));

      if(maxY < minY) y = vvTop + Math.max(0,(vv.height-bh)/2);
      else y = Math.max(minY, Math.min(y, maxY));

      bar.style.setProperty('transform', 'translate3d(' + x + 'px,' + y + 'px,0)', 'important');
    }else{
      let x = (vv.offsetLeft || 0) + 20;
      let y = (vv.offsetTop || 0) + vv.height - bh - 20;
      let minX = (vv.offsetLeft || 0) + 8;
      let maxX = (vv.offsetLeft || 0) + vv.width - bw - 8;
      let minY = (vv.offsetTop || 0) + 8;
      let maxY = (vv.offsetTop || 0) + vv.height - bh - 8;

      if(maxX >= minX) x=Math.max(minX,Math.min(x,maxX));
      if(maxY >= minY) y=Math.max(minY,Math.min(y,maxY));

  // --- ORGAN FLUTES V4 - CORRECT KLAVAR PLAYBACK LOGIC ---
  let __audioCtx = null;
  let __isPlaying = false;

  function noteToMidi(s){
    if(!s) return null;
    let m=s.trim().match(/^([A-G])(#|b)?(-?\d+)$/i);
    if(!m) m=s.trim().match(/^([A-G])\s*(#|b)?\s*(\d+)$/i);
    if(!m) return null;
    let base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
    if(m[2]=='#') base+=1;
    if(m[2]=='b') base-=1;
    return (parseInt(m[3],10)+1)*12+base;
  }
  function Z(m,b){
  try{
    let mm=parseInt(m)||0; let s=0;
    for(let i=0;i<mm;i++){ let beats=4; try{ if(typeof __getBeats==='function') beats=__getBeats(i); }catch(e){} if(!isFinite(beats)||beats<=0) beats=4; s+=beats; }
    return s+((parseFloat(b)||1)-1);
  }catch(e){ return (parseInt(m)||0)*4 + ((parseFloat(b)||1)-1); }
}

  function getAllData(){

  function buildTimedNotes(){
    let {notes, stops, conts} = getAllData();
    if(!notes.length) return [];

    let enriched = notes.map(n=>{
      let midi = n.note ? noteToMidi(n.note) : null;
      if(midi==null && n.midi!=null) midi=+n.midi;
      if(midi==null) return null;
      let g = Z(n.m, n.beat);
      if(n.globalBeat!=null) g=+n.globalBeat;
      if(n.startBeat!=null) g=+n.startBeat;
      let isGrace = !!(n.grace || n.graceVisual || n.isGrace);
      return {id:n.id, midi, hand:n.hand||'RH', noteName:n.note, start:g, m:+n.m||0, beat:+n.beat||1, isGrace};
    }).filter(Boolean);
    enriched.sort((a,b)=>a.start-b.start);

    // Index stops and continues by time
    let stopsByTarget = new Map();
    let stopsByTime = new Map();
    stops.forEach(s=>{
      let t = Z(s.m, s.beat);
      if(s.globalBeat!=null) t=+s.globalBeat;
      let key = s.targetId||s.target_id||'';
      if(key){ if(!stopsByTarget.has(key)) stopsByTarget.set(key, []); stopsByTarget.get(key).push(t); }
      if(!stopsByTime.has(t)) stopsByTime.set(t, []);
      stopsByTime.get(t).push(s);
    });

    let contsByOldId = new Map();
    let contsByTime = new Map();
    conts.forEach(c=>{
      let newT = Z(c.newM, c.newBeat);
      if(!contsByTime.has(newT)) contsByTime.set(newT, []);
      contsByTime.get(newT).push(c);
      if(c.oldId){ 
        if(!contsByOldId.has(c.oldId)) contsByOldId.set(c.oldId, []);
        contsByOldId.get(c.oldId).push(newT);
      }
    });

    let maxStart = Math.max(...enriched.map(e=>e.start),0);
    let finalTime = maxStart + 4.5;

    // All measure boundaries
    let measureBounds=[];
    for(let mm=1; mm*4 < finalTime; mm++) measureBounds.push(mm*4);

    let result=[];

    // For each note, find its end by looking ahead
    for(let i=0;i<enriched.length;i++){
      let cur = enriched[i];
      if(cur.isGrace){
        result.push({midi:cur.midi, start:cur.start, end:cur.start+0.20, hand:cur.hand, id:cur.id, noteName:cur.noteName, isGrace:true});
        continue;
      }

      let end = finalTime;

      // 1) Next same-hand NON-grace note
      for(let j=i+1;j<enriched.length;j++){
        let nxt = enriched[j];
        if(nxt.isGrace) continue;
        if(nxt.hand!==cur.hand) continue;
        if(nxt.start <= cur.start+0.01) continue; // same time chord, don't cut
        // Is there a continue dot at nxt.start that references cur?
        let hasCont = false;
        // check by oldId
        if(contsByOldId.has(cur.id)){
          for(let ct of contsByOldId.get(cur.id)){
            if(Math.abs(ct - nxt.start)<0.12){ hasCont=true; break; }
          }
        }
        // check by noteName+hand at that time
        if(!hasCont){
          let contsAtTime = contsByTime.get(nxt.start);
          if(!contsAtTime){
            for(let [t, arr] of contsByTime.entries()){
              if(Math.abs(t-nxt.start)<0.12){ contsAtTime=arr; break; }
            }
          }
          if(contsAtTime){
            for(let c of contsAtTime){
              if(c.oldNote===cur.noteName && c.hand===cur.hand){ hasCont=true; break; }
              if(c.oldId===cur.id){ hasCont=true; break; }
            }
          }
        }
        if(!hasCont){
          end = Math.min(end, nxt.start);
          break; // earliest same-hand note without continue stops it
        }
        // else continue dot exists, so keep looking to next same-hand note
      }

      // 2) Next measure boundary after cur.start
      for(let mb of measureBounds){
        if(mb <= cur.start+0.01) continue;
        if(mb >= end-0.001) break; // already stopped earlier
        let hasCont = false;
        if(contsByOldId.has(cur.id)){
          for(let ct of contsByOldId.get(cur.id)){
            if(Math.abs(ct - mb)<0.12){ hasCont=true; break; }
          }
        }
        if(!hasCont){
          let contsAtTime = contsByTime.get(mb);
          if(!contsAtTime){
            for(let [t, arr] of contsByTime.entries()){
              if(Math.abs(t-mb)<0.12){ contsAtTime=arr; break; }
            }
          }
          if(contsAtTime){
            for(let c of contsAtTime){
              if(c.oldNote===cur.noteName && c.hand===cur.hand){ hasCont=true; break; }
              if(c.oldId===cur.id){ hasCont=true; break; }
            }
          }
        }
        if(!hasCont){
          end = Math.min(end, mb);
          break;
        }
      }

      // 3) Stop dots targeting this note
      if(stopsByTarget.has(cur.id)){
        for(let st of stopsByTarget.get(cur.id)){
          if(st > cur.start+0.01 && st < end){
            end = st;
          }
        }
      }
      // Also stop dots by noteName+hand
      for(let [t, arr] of stopsByTime.entries()){
        if(t <= cur.start+0.01) continue;
        if(t >= end) continue;
        for(let s of arr){
          if(s.note && s.note===cur.noteName && (!s.hand || s.hand===cur.hand)){
            end = Math.min(end, t);
          }
        }
      }

      if(end <= cur.start) end = cur.start + 0.5;
      result.push({midi:cur.midi, start:cur.start, end, hand:cur.hand, id:cur.id, noteName:cur.noteName, isGrace:false});
    }

    if(result.length){
      let min = Math.min(...result.map(r=>r.start));
      result.forEach(r=>{ r.start-=min; r.end-=min; });
    }
    result.sort((a,b)=>a.start-b.start);
    __finalTime = Math.max(...result.map(r=>r.end),0)+0.5; window.__finalTime=__finalTime;
    console.log('v15 built', result.length, 'final', __finalTime, 'sample', result.slice(0,5).map(r=>`${r.noteName} s${r.start.toFixed(2)} e${r.end.toFixed(2)} ${r.hand}`));
    return result;
  }



  

  function playNotes(timed){
    try{ window.__isPlaying=true; if(window.__playBtnEnforcer) clearInterval(window.__playBtnEnforcer); window.__playBtnEnforcer=setInterval(()=>{ try{ if(typeof enforcePlayBtn==='function') enforcePlayBtn(); }catch(e){} },150); }catch(e){}
    if(!window.__audioCtx) window.__audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let __audioCtx = window.__audioCtx;
    if(__audioCtx.state==='suspended') __audioCtx.resume();
    if(!__audioCtx.__masterGain){
      let mg=__audioCtx.createGain(); mg.gain.value=0.28;
      mg.connect(__audioCtx.destination);
      __audioCtx.__masterGain=mg;
    }
    try{
      let sched = window.__scheduled||[];
      sched.forEach(g=>{
        try{ if(g.bufferNode){ try{g.bufferNode.onended=null;}catch(e){} try{g.bufferNode.stop();}catch(e){} try{g.bufferNode.disconnect();}catch(e){} } }catch(e){}
      });
    }catch(e){}
    window.__scheduled=[];
    let beatSec=60/88;
    let sampleRate = __audioCtx.sampleRate || 44100;
    let firstStart = Math.min(...timed.map(t=>t.start));
    let lastEnd = Math.max(...timed.map(t=>t.end),0);
    let totalBeats = lastEnd - firstStart + 1.5;
    let totalSec = totalBeats * beatSec + 0.5;
    let totalSamples = Math.ceil(totalSec * sampleRate);
    let buffer = new Float32Array(totalSamples);
    timed.forEach(n=>{
      let sSample = Math.floor((n.start - firstStart)*beatSec*sampleRate);
      let eSample = Math.floor((n.end - firstStart)*beatSec*sampleRate);
      if(eSample<=sSample) eSample = sSample + Math.floor((n.isGrace?0.12:0.30)*sampleRate);
      if(sSample<0) sSample=0;
      if(eSample>totalSamples) eSample=totalSamples;
      let freq=440*Math.pow(2,(n.midi-69)/12);
      let amp = n.isGrace?0.09:0.13;
      let partials = n.isGrace ? [{mult:1, gain:1.0}] : [{mult:1,gain:1.0},{mult:2,gain:n.midi<52?0.42:0.28}];
      for(let i=sSample;i<eSample;i++){
        let t = (i - sSample)/sampleRate;
        let env=1; let dur = (eSample-sSample)/sampleRate;
        if(t<0.008) env = t/0.008;
        else if(t>dur-0.04) env = Math.max(0, (dur - t)/0.04);
        let sample=0;
        partials.forEach(p=>{ sample += Math.sin(2*Math.PI*freq*p.mult*t) * p.gain; });
        buffer[i] += sample * env * amp * 0.28;
      }
    });
    for(let i=0;i<totalSamples;i++){ let v=buffer[i]; if(v>0.95) v=0.95 + (v-0.95)*0.1; if(v<-0.95) v=-0.95 + (v+0.95)*0.1; buffer[i]=v; }
    let audioBuf = __audioCtx.createBuffer(1, totalSamples, sampleRate);
    audioBuf.getChannelData(0).set(buffer);
    window._mBuf=audioBuf;
    window._ps=__audioCtx.currentTime+0.1;
    let src = __audioCtx.createBufferSource();
    src.buffer = audioBuf;
    src.connect(__audioCtx.__masterGain);
    src.start(window._ps,0);
    window.__scheduled=[{bufferNode:src}];
    window.__finalTime = lastEnd + 0.5;
    src.onended = ()=>{
      if(window._isPausing){ return; }
      if(window.__isPlaying){
        window.__isPlaying=false; window._paused=false; window._pe=0;
        let playBtn=document.getElementById('outer-playback-btn');
        if(playBtn){ playBtn.textContent='> Play'; playBtn.classList.remove('active'); }
        if(window.__playBtnEnforcer){ clearInterval(window.__playBtnEnforcer); window.__playBtnEnforcer=null; }
      }
    };
  }

  function buildMidi(timed){
    const TPQ=480, us=Math.round(60000000/90);
    let ev=[]; timed.forEach(n=>{ ev.push({tick:Math.round(n.start*TPQ),type:'on',midi:n.midi}); ev.push({tick:Math.round(n.end*TPQ),type:'off',midi:n.midi}); });
    ev.sort((a,b)=>a.tick-b.tick||(a.type==='off'?-1:1));
    let tr=[0,255,81,3,(us>>16)&255,(us>>8)&255,us&255,0,192,73];
    let last=0; ev.forEach(e=>{ let d=e.tick-last; tr.push(...writeVarLen(d)); if(e.type==='on') tr.push(144,e.midi,70); else tr.push(128,e.midi,0); last=e.tick; });
    tr.push(0,255,47,0);
    let hdr=[77,84,104,100,0,0,0,6,0,1,0,1,(TPQ>>8)&255,TPQ&255];
    let th=[77,84,114,107,(tr.length>>24)&255,(tr.length>>16)&255,(tr.length>>8)&255,tr.length&255];
    return new Uint8Array([...hdr,...th,...tr]);
  }

                        const targetM = measureNum;
                        const targetB = beatNum;
                        const valNum2 = Number(val)||0;
                        // 1. Delete notes - for fractional, delete beats above + first val% of this beat
                        // If val=0.25, delete beat < targetB + 0.25
                        const removed=(m,b)=>{
                          const mm=Number(m), bb=Number(b);
                          if(mm!==targetM) return false;
                          if(!Number.isFinite(bb)) return false;
                          if(bb < targetB) return true; // beats above
                          if(bb < targetB + valNum2) return true; // first val% of selected beat
                          return false;
                        };
                        const arr=(k)=>{try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}};
                        const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
                        const hostWin=(window.parent && window.parent!==window)?window.parent:window;
                        const notes=Array.isArray(hostWin.__klavarLiveNotes)?hostWin.__klavarLiveNotes:arr('klavar_notes');
                        const gone=new Set(notes.filter(n=>removed(n.m,n.beat)).map(n=>n.id));
                        // For remaining notes in this measure, move them up: beat 4 -> beat 1, etc., accounting for fractional val
                        // New beat = 1 + (oldBeat - targetB - val)
                        // For val=0, beat 4 -> 1, beat 3 -> 1, beat 4 -> 2 (when beat 3 case)
                        // For val=0.25, beat 4.25 -> 1, beat 4.5 -> 1.25, etc.
                        const nextNotes=notes.filter(n=>!removed(n.m,n.beat)).map(n=>{
                          if(Number(n.m)===targetM && Number.isFinite(Number(n.beat))){
                            const bb=Number(n.beat);
                            if(bb >= targetB + valNum2){
                              return {...n, beat: 1 + (bb - targetB - valNum2)};
                            }
                          }
                          return n;
                        });
                        if(typeof hostWin.__setKlavarNotes==='function') hostWin.__setKlavarNotes(nextNotes);
                        put('klavar_notes',nextNotes);
                        const stops=Array.isArray(hostWin.__klavarLiveStops)?hostWin.__klavarLiveStops:arr('klavar_stops');
                        const nextStops=stops.filter(x=>!removed(x.m,x.beat)).map(x=>{
                          if(Number(x.m)===targetM && Number.isFinite(Number(x.beat))){
                            const bb=Number(x.beat);
                            if(bb >= targetB + valNum2){
                              return {...x, beat: 1 + (bb - targetB - valNum2)};
                            }
                          }
                          return x;
                        });
                        if(typeof hostWin.__setKlavarStops==='function') hostWin.__setKlavarStops(nextStops); else put('klavar_stops',nextStops);
                        // Also move continues, beams, slurs that reference this measure, and delete those that reference deleted notes
                        try{
                          const continues=Array.isArray(hostWin.__klavarLiveContinues)?hostWin.__klavarLiveContinues:arr('klavar_continues');
                          const nextContinues=continues.filter(x=>!gone.has(x.oldId)&&!gone.has(x.newId)&&!removed(x.oldM,x.oldBeat)&&!removed(x.newM,x.newBeat)).map(c=>{
                            let nc={...c};
                            if(Number(c.oldM)===targetM && Number(c.oldBeat)>=targetB + valNum2) nc.oldBeat = 1 + (Number(c.oldBeat) - targetB - valNum2);
                            if(Number(c.newM)===targetM && Number(c.newBeat)>=targetB + valNum2) nc.newBeat = 1 + (Number(c.newBeat) - targetB - valNum2);
                            return nc;
                          });
                          if(typeof hostWin.__setKlavarContinues==='function') hostWin.__setKlavarContinues(nextContinues); else put('klavar_continues',nextContinues);
                          const beams=Array.isArray(hostWin.__klavarLiveBeams)?hostWin.__klavarLiveBeams:arr('klavar_beams');
                          const nextBeams=beams.filter(x=>!gone.has(x.startId)&&!gone.has(x.endId)&&!removed(x.startM,x.startBeat)&&!removed(x.endM,x.endBeat)).map(b=>{
                            let nb={...b};
                            if(Number(b.startM)===targetM && Number(b.startBeat)>=targetB + valNum2) nb.startBeat = 1 + (Number(b.startBeat) - targetB - valNum2);
                            if(Number(b.endM)===targetM && Number(b.endBeat)>=targetB + valNum2) nb.endBeat = 1 + (Number(b.endBeat) - targetB - valNum2);
                            return nb;
                          });
                          if(typeof hostWin.__setKlavarBeams==='function') hostWin.__setKlavarBeams(nextBeams); else put('klavar_beams',nextBeams);
                          const slurs=Array.isArray(hostWin.__klavarLiveSlurs)?hostWin.__klavarLiveSlurs:arr('klavar_slurs');
                          const nextSlurs=slurs.filter(x=>!gone.has(x.startId)&&!gone.has(x.endId)&&!removed(x.startM,x.startBeat)&&!removed(x.endM,x.endBeat));
                          if(typeof hostWin.__setKlavarSlurs==='function') hostWin.__setKlavarSlurs(nextSlurs); else put('klavar_slurs',nextSlurs);
                        }catch(e){ console.log('move continues/beams error',e); }
                        
                        // 2. Reduce beats in measure using existing tool - this is what you suggested
                        try{
                          // Clear any old anacrusis pickups that might mess up score
                          // Only keep current
                          for(let i=localStorage.length-1;i>=0;i--){
                            const k = localStorage.key(i);
                            if(k && k.indexOf('klavar_anacrusis_pickup_')===0 && k!=='klavar_anacrusis_pickup_'+targetM){
                              // Don't clear all, just log
                            }
                          }
                          if(hostWin.__setBeatsMap){
                            hostWin.__setBeatsMap(prev=>{
                              const next = Object.assign({}, prev);
                              // Baby 21 fix: Anacrusis is ONE measure only, not beats-per-measure
                              // Don't set __measureBeats for anacrusis as permanent change
                              // Instead, only store pickup in localStorage, and ensure following measures keep original
                              // Previously we set next[targetM]=remaining which caused all following to become remaining
                              // Now: remove any existing entry for targetM that might be anacrusis, and ensure next measure has original
                              // Actually, we need to keep targetM out of __measureBeats, so __getBeats will ignore it for following
                              // Delete anacrusis entry from beats map if it exists
                              if(next.hasOwnProperty(targetM)){
                                // If targetM was previously an anacrusis, delete it to avoid it affecting following
                                try{
                                  const rawExisting = localStorage.getItem('klavar_anacrusis_pickup_'+targetM);
                                  if(rawExisting){
                                    // This is anacrusis, don't keep it in beats map
                                    delete next[targetM];
                                  } else {
                                    // Not anacrusis, keep as beats-per-measure change? But for anacrusis we want 1 measure only
                                    // So still delete and rely on pickup
                                    delete next[targetM];
                                  }
                                }catch(e){ delete next[targetM]; }
                              }
                              // Ensure following measures have original beats - set targetM+1 to origBeats if not already set
                              // Only set if not already an anacrusis itself
                              try{
                                const rawNext = localStorage.getItem('klavar_anacrusis_pickup_'+(targetM+1));
                                if(!rawNext){
                                  next[targetM+1] = origBeats;
                                }
                              }catch(e){
                                next[targetM+1] = origBeats;
                              }
                              console.log('Baby 21: Anacrusis measure', targetM, 'is', remaining, 'beats (one measure only, stored in localStorage), measure', targetM+1, 'restored to', origBeats);
                              return next;
                            });
                            if(hostWin.__setBeatVer) hostWin.__setBeatVer(v=>v+1);
                          }
                          // Store pickup for beat number display and for __getBeats override - this is the ONLY place anacrusis beats are stored
                          // Baby 24: also store val for fractional beat numbering (no number for decimal start)
                          localStorage.setItem('klavar_anacrusis_pickup_'+targetM, JSON.stringify({startBeat: targetB, remaining: remaining, original: origBeats, val: valNum2}));
                          // Also set directly for immediate rendering, but __getBeats will ignore this for following measures
                          if(typeof __measureBeats!=='undefined'){
                            // For anacrusis, we still set it for current measure rendering, but __getBeats will skip it for following
                            __measureBeats[targetM]=remaining;
                            // Don't set next to avoid affecting following? Actually set next to original to be safe
                            __measureBeats[targetM+1]=origBeats;
                          }
                        }catch(e){ console.log('set beats error',e); }
                        
                        t.style.fill='red';
                        setTimeout(()=>{ try{ window.location.reload(); }catch(e){} },700);
                      }catch(err){ console.log('Baby 9 error',err); alert('Error: '+err.message); }
                    } else {
                      // Row B - RETAIN val of beat - keep beats 1..(beatNum-1) + first val% of beatNum
                      try{
                        const targetM = measureNum;
                        const targetB = beatNum;
                        const valNum2 = Number(val)||0;
                        const remainingB = Math.max(0.25, (targetB - 1) + valNum2);
                        const removedB=(m,b)=>{
                          const mm=Number(m), bb=Number(b);
                          if(mm!==targetM) return false;
                          if(!Number.isFinite(bb)) return false;
                          if(valNum2===0){
                            return bb >= targetB;
                          } else {
                            return bb >= targetB + valNum2;
                          }
                        };
                        const arr=(k)=>{try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}};
                        const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
                        const hostWin=(window.parent && window.parent!==window)?window.parent:window;
                        const notes=Array.isArray(hostWin.__klavarLiveNotes)?hostWin.__klavarLiveNotes:arr('klavar_notes');
                        const gone=new Set(notes.filter(n=>removedB(n.m,n.beat)).map(n=>n.id));
                        const nextNotes=notes.filter(n=>!removedB(n.m,n.beat));
                        const stops=arr('klavar_stops');
                        const nextStops=stops.filter(x=>!removedB(x.m,x.beat));
                        const continues=arr('klavar_continues');
                        const nextContinues=continues.filter(x=>!gone.has(x.oldId)&&!gone.has(x.newId)&&!removedB(x.oldM,x.oldBeat)&&!removedB(x.newM,x.newBeat));
                        const beams=arr('klavar_beams');
                        const nextBeams=beams.filter(x=>!gone.has(x.startId)&&!gone.has(x.endId)&&!removedB(x.startM,x.startBeat)&&!removedB(x.endM,x.endBeat));
                        const measures=arr('klavar_measures');
                        let found=false;
                        const nextMeasures=measures.map(mm=>{
                          if(Number(mm.m)===targetM){
                            found=true;
                            return {...mm, beats: remainingB, original: origBeats};
                          }
                          return mm;
                        });
                        if(!found){
                          nextMeasures.push({m:targetM, beats: remainingB, original: origBeats});
                        }
                        put('klavar_notes', nextNotes);
                        put('klavar_stops', nextStops);
                        put('klavar_continues', nextContinues);
                        put('klavar_beams', nextBeams);
                        put('klavar_measures', nextMeasures);
                        if(Array.isArray(hostWin.__klavarLiveNotes)) hostWin.__klavarLiveNotes = nextNotes;
                        // For Row B, we use measures storage, not anacrusis pickup - clear any pickup
                        try{ localStorage.removeItem('klavar_anacrusis_pickup_'+targetM); }catch(e){}
                        try{
                          if(typeof __measureBeats!=='undefined'){
                            __measureBeats[targetM]=remainingB;
                          }
                          if(typeof __setBeatsMap==='function'){
                            __setBeatsMap(prev=>{
                              const next={...prev};
                              next[targetM]=remainingB;
                              return next;
                            });
                          }
                        }catch(e){}
                        if(hostWin.__setBeatVer) hostWin.__setBeatVer(v=>v+1);
                        t.style.fill='blue';
                        setTimeout(()=>{ try{ window.location.reload(); }catch(e){} },700);
                      }catch(err){ console.log('Row B error',err); alert('Row B Error: '+err.message); }
                    }
                  }
                  // Use both click and touchend for mobile
                  continueBtn.addEventListener('click',(ev)=>{ ev.stopPropagation(); ev.preventDefault(); doContinueAmount(); });
                  continueBtn.addEventListener('touchend',(ev)=>{ ev.stopPropagation(); ev.preventDefault(); doContinueAmount(); });
                  cancelAmountBtn.addEventListener('click',(ev)=>{ ev.stopPropagation(); ev.preventDefault(); amountDialog.remove(); });
                  cancelAmountBtn.addEventListener('touchend',(ev)=>{ ev.stopPropagation(); ev.preventDefault(); amountDialog.remove(); });
                  amountInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); doContinueAmount(); } if(e.key==='Escape'){ amountDialog.remove(); } });
                  // Prevent dialog from closing when tapping input
                  amountInput.addEventListener('click',(e)=>{ e.stopPropagation(); });
                  amountInput.addEventListener('touchstart',(e)=>{ e.stopPropagation(); });
                });

                dialog.appendChild(b);
              });
              doc.body.appendChild(dialog);
              let rect=t.getBoundingClientRect();
              dialog.style.left=Math.max(4,Math.min(window.innerWidth-260,rect.right+8))+'px';
              dialog.style.top=Math.max(4,Math.min(window.innerHeight-150,rect.top-4))+'px';
            });
          });
        });
        console.log('Wired beat numbers:', beatTexts.length);

        beatTexts.forEach(restoreAnacrusisLine);
        applyAllAnacrusisVisibility();
        setTimeout(applyAllAnacrusisVisibility,100);
        setTimeout(applyAllAnacrusisVisibility,300);
        applyColumnEndStaffCut();
        setTimeout(applyColumnEndStaffCut,100);
        setTimeout(applyColumnEndStaffCut,300);

        measureTexts.forEach(t=>{
          if(t.dataset.mnWired) return;
          t.dataset.mnWired='1';
          t.classList.add('measure-num');
          t.style.cursor='pointer';
          t.style.pointerEvents='auto';
          t.addEventListener('click', (e)=>{
            e.stopPropagation();
            let num = (t.textContent||'').trim();
            doc.querySelectorAll('text.measure-num.mn-selected').forEach(el=>el.classList.remove('mn-selected'));
            t.classList.add('mn-selected');
            let picker = doc.getElementById('barline-type-picker');
            if(picker){
              picker.dataset.measure=num;
              if(doc.__renderBarlineButtons) doc.__renderBarlineButtons();
              if(doc.__renderFermataRows) doc.__renderFermataRows();
              let rect = t.getBoundingClientRect();
              let isPhone = window.innerWidth < 600;
              let left, top;
              if(isPhone){
                left = 4;
                top = window.innerHeight - 90;
                picker.style.right = '4px';
                picker.style.left = '4px';
                picker.style.transform = 'none';
                picker.style.maxWidth = (window.innerWidth - 8) + 'px';
                picker.style.width = 'auto';
              } else {
                left = rect.right + 10;
                if(left + 300 > window.innerWidth) left = Math.max(8, rect.left - 300);
                top = rect.top - 8;
                if(top < 90) top = rect.bottom + 10;
                if(top + 60 > window.innerHeight) top = window.innerHeight - 70;
                picker.style.left=left+'px';
                picker.style.right='';
                picker.style.transform='';
                picker.style.maxWidth='';
              }
              picker.style.top=top+'px';
              if(!isPhone){
                picker.style.left=left+'px';
              }
              picker.classList.add('show');
            }
          });
        });
        console.log('Wired measure numbers:', measureTexts.length);
      }catch(e){ console.log('mn wire error', e); }

      iframe.classList.add('ready');
      }catch(e){ console.log(e); } });
    }catch(e){ console.log(e); }
  }, 100);
});

window.addEventListener('resize',function(){
  try{window.__klavarPageScroller();}catch(e){}
});

<script>
  window.__isLongMode = localStorage.getItem('__klavar_longMode') === '1';

    try{

        }catch(e){}

          var CAPACITY=840;

          restoredMpc=Array.from({length:4}, function(){ return firstFit+(addOne?1:0); });

      window.__isLongMode = !window.__isLongMode;
      localStorage.setItem('__klavar_longMode', window.__isLongMode ? '1' : '0');
      localStorage.setItem('klavar_colCount', window.__isLongMode ? '1' : '3');
      localStorage.setItem('klavar_measuresPerCol', JSON.stringify(window.__isLongMode ? [100] : [7,7,7]));
    }
    try{ window.dispatchEvent(new CustomEvent('klavar-longmode-changed')); localStorage.setItem('klavar-longmode-changed-ts', Date.now().toString()); }catch(e){}
    location.reload();
  };

  (function(){
    try{
      var isLong = false;
      try{ isLong = localStorage.getItem('__klavar_longMode') === '1'; }catch(e){}
      if(!isLong){
        var cc = localStorage.getItem('klavar_colCount');
        if(cc==='4' || cc===null){
          localStorage.setItem('klavar_colCount','3');
        }
        var mpcRaw = localStorage.getItem('klavar_measuresPerCol');
        if(mpcRaw){
          try{
            var arr = JSON.parse(mpcRaw);
            if(Array.isArray(arr) && arr.length===4){
              localStorage.setItem('klavar_measuresPerCol', JSON.stringify(arr.slice(0,3)));
            }
          }catch(e){}
        }
      }
    }catch(e){}
  })();
  (function(){
    function lockCols(){
      try{
        var isLong = false;
        try{ isLong = localStorage.getItem('__klavar_longMode') === '1'; }catch(e){}
        if(!isLong) isLong = document.body.classList.contains('long-mode');
        if(!isLong){
          var btns = document.querySelectorAll('.col-select-btn');
          for(var i=0;i<btns.length;i++){ btns[i].style.opacity=''; btns[i].style.pointerEvents=''; btns[i].disabled=false; }
          return;
        }
        var btns = document.querySelectorAll('.col-select-btn');
        for(var i=0;i<btns.length;i++){
          var t = (btns[i].textContent||'').trim();
          btns[i].style.pointerEvents='none';
          btns[i].disabled=true;
          btns[i].style.opacity = t==='1' ? '0.9' : '0.35';
        }
        var allB = document.querySelectorAll('button');
        for(var j=0;j<allB.length;j++){
          if((allB[j].textContent||'').trim()==='Top'){
            allB[j].style.opacity='0.35';
            allB[j].style.pointerEvents='none';
            allB[j].disabled=true;
          }
        }
        var sels = document.querySelectorAll('select');
        for(var k=0;k<sels.length;k++){
          if((sels[k].title||'').indexOf('Top alignment')>=0){
            sels[k].style.opacity='0.35';
            sels[k].style.pointerEvents='none';
            sels[k].disabled=true;
          }
        }
      }catch(e){}
    }
    setTimeout(lockCols, 300);
    setTimeout(lockCols, 1000);
    (function(){
      try{
        lockCols();
        const obs=new MutationObserver(()=>{ lockCols(); });
        obs.observe(document.body,{attributes:true,attributeFilter:['class']});
        const root=document.getElementById('root');
        if(root){ const sheetObs=new MutationObserver(()=>{ lockCols(); }); sheetObs.observe(root,{childList:true,subtree:true}); }
      }catch(e){}
    })();
  })();


  (function(){
    function applyNarrowTitle(){
      try{
        var isLong = false;
        try{ isLong = localStorage.getItem('__klavar_longMode') === '1'; }catch(e){}
        if(!isLong) isLong = document.body.classList.contains('long-mode');
        var frames = document.querySelectorAll('#a4-sheet iframe');
        frames.forEach(function(fr){
          try{
            var doc = fr.contentDocument;
            if(!doc) return;
            var hdr = doc.getElementById('score-title-wide');
            if(hdr){
              if(isLong){
                hdr.style.width='90mm';
                hdr.style.maxWidth='45%';
                hdr.style.marginLeft='auto';
                hdr.style.marginRight='auto';
              } else {
                hdr.style.width='100%';
                hdr.style.maxWidth='100%';
                hdr.style.marginLeft='';
                hdr.style.marginRight='';
              }
            }
          }catch(e){}
        });
      }catch(e){}
    }
    setTimeout(applyNarrowTitle, 500);
    setTimeout(applyNarrowTitle, 1500);
    setTimeout(applyNarrowTitle, 3000);
    (function(){
      try{
        document.querySelectorAll('#a4-sheet iframe').forEach(fr=>{
          fr.addEventListener('load', ()=>{ setTimeout(applyNarrowTitle,100); });
        });
        const mo=new MutationObserver(()=>{
          const isLong=localStorage.getItem('__klavar_longMode')==='1' || document.body.classList.contains('long-mode');
          if(isLong) applyNarrowTitle();
        });
        mo.observe(document.body,{attributes:true,attributeFilter:['class']});
      }catch(e){}
    })();
  })();

<style>
  #mode-bar{position:static; transform:none; z-index:10; display:flex; gap:10px; pointer-events:auto; margin: 8px 0 16px 0; padding: 0 2px;}
  #mode-bar button{padding:8px 14px; border-radius:8px; border:1px solid rgba(0,0,0,0.15); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,0.1); cursor:pointer; font-size:12px; background:white; color:#111; }
  #mode-bar button#btn-long-pdf{background:#6c5ce7 !important; color:white !important; border:none;}
  #mode-bar button#btn-toggle-mode{background:#111; color:white; border:none;}
  body:not(.long-mode) #btn-long-pdf{ display:none !important; }

  /* LONG MODE BASE: make page tall and scrollable */
  body.long-mode{ overflow:auto !important; touch-action:auto !important; }
  body.long-mode #a4-sheet{ height:auto !important; min-height:auto !important; overflow:visible !important; }
  body.long-mode #a4-sheet > div:last-child{ 
    height:auto !important; min-height:auto !important; max-height:none !important; 
    overflow:visible !important; display:block !important;
  }
  body.long-mode #a4-sheet > div:last-child iframe{ 
    height:12500px !important; min-height:12500px !important; max-height:none !important;
    display:block !important;
    border: 2px solid #ff0000 !important;
    box-sizing: border-box !important;
  }
  /* child iframes in long view get same colored borders as A4 */
  body.long-mode .a4-extra-page iframe{
    border: 2px solid #ff0000 !important;
    box-sizing: border-box !important;
  }

  /* LONG MODE EDIT: MUST allow scroll to area before lasso - override the original lock */
  body.long-mode.edit-mode{ overflow:auto !important; touch-action:auto !important; }
  body.long-mode.edit-mode #a4-sheet{ overflow:visible !important; }
  body.long-mode.edit-mode #a4-sheet > div:last-child{ 
    overflow:visible !important; /* let body scroll, not inner lock */
    touch-action:auto !important;
    height:auto !important; max-height:none !important;
  }
  body.long-mode.edit-mode #a4-sheet > div:last-child iframe{ 
    pointer-events:auto !important; 
    touch-action:none !important; /* keep lasso working on SVG */
  }

<script>
  (function(){
    if(window.__isLongMode) document.body.classList.add('long-mode');
    function placeModeBar(){
      try{
        var bar=document.getElementById('mode-bar');
        if(!bar) return;
        // Find h1 KlavarScore Editor - it's inside #root shadow? Look for h1 text
        var h1s=document.querySelectorAll('h1');
        var target=null;
        for(var i=0;i<h1s.length;i++){
          if((h1s[i].textContent||'').indexOf('KlavarScore')!==-1){ target=h1s[i]; break; }
        }
        if(target){
          var parent=target.parentElement;
          if(parent && bar.parentElement!==parent){
            // insert after h1's container (mb-3)
            var container = target.closest('.mb-3') || target.parentElement;
            if(container && container.nextSibling!==bar){
              container.parentNode.insertBefore(bar, container.nextSibling);
            }
          }
        }
      }catch(e){}
    }
    document.addEventListener('DOMContentLoaded', function(){
      if(window.__isLongMode) document.body.classList.add('long-mode');
      var b=document.getElementById('btn-toggle-mode');
      if(b) b.textContent = window.__isLongMode ? 'Switch to A4 Editor' : 'Switch to Scrolling KlavarScore Editor';
      placeModeBar();
      // retry after React renders
      setTimeout(placeModeBar, 200);
      setTimeout(placeModeBar, 800);
      setTimeout(placeModeBar, 2000);
    });
    // Also observe root for changes
    var obsInterval=setInterval(function(){ placeModeBar(); }, 1000);
    setTimeout(function(){ clearInterval(obsInterval); }, 8000);
  })();
</script>

(function(){
  // Restore the saved title after the React-rendered iframe and its score header exist.
  // The iframe is rebuilt during startup, so a one-time call can run too early.
  function restoreHeaderWhenReady(){
    let tries=0;
    const timer=setInterval(()=>{
      tries++;
      try{
        const fr=document.querySelector('#a4-sheet iframe');
        if(fr && !fr.__klavarRestoreHooked){
          fr.__klavarRestoreHooked=true;
          fr.addEventListener('load',()=>{
            setTimeout(()=>{ try{ applyHeader(); bindHeaderSaving(); }catch(e){} },0);
          });
        }
        const ok=applyHeader();
        if(ok) bindHeaderSaving();
        if(ok || tries>100) clearInterval(timer);
      }catch(e){ if(tries>100) clearInterval(timer); }
    },100);
  }
  restoreHeaderWhenReady();

  function getLiveHeader(){
    try{
      const iframe=document.querySelector('#a4-sheet iframe');
      const doc=iframe && iframe.contentDocument;
      const h=doc && doc.querySelector('#score-title-wide');
      return h || null;
    }catch(e){ return null; }
  }
  function getAll(){
    const out={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('klavar_')){
        try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch(e){ out[k]=localStorage.getItem(k); }
      }
    }
    // The visible editable header is inside the main same-origin score iframe.
    // Read it directly from that iframe at save time.
    try{
      const h=getLiveHeader();
      if(h){
        const fields=h.querySelectorAll('[contenteditable=\"true\"]');
        const headerKeys=['klavar_collection','klavar_title','klavar_key','klavar_composer','klavar_instructions','klavar_scrollTime'];
        const headerDefaults=['Volume / Collection','Title of piece','Key','Composer','Playing instructions','Scroll Time'];
        headerKeys.forEach((key,i)=>{
          const el=fields[i]; if(!el) return;
          const v=(el.innerText!=null?el.innerText:el.textContent||'').replace(/\u00a0/g,' ').trim();
          const saved=localStorage.getItem(key);
          if(v && v!==headerDefaults[i]) out[key]=v;
          else if(saved && saved!==headerDefaults[i]) out[key]=saved;
          try{if(out[key]) localStorage.setItem(key,out[key])}catch(e){}
        });
      }
    }catch(e){}
    try{ bindHeaderSaving(); }catch(e){}
    // The staff-range controls live inside the same-origin score iframe.
    // Read their actual current values at save time rather than relying only
    // on the iframe's localStorage writes.
    try{
      const fr=document.querySelector('#a4-sheet iframe');
      const doc=fr && fr.contentDocument;
      if(doc){
        const sels=doc.querySelectorAll('select');
        for(const sel of sels){
          const v=sel.value;
          if(['C2','D2','E2','F2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6','D6','E6','F6','G6','A6','B6'].includes(v)){
            const prev=sel.previousElementSibling;
            const txt=prev&&prev.textContent?prev.textContent.trim():'';
            if(txt==='Range:' || (txt==='..' && !out['klavar_staffBottom'])) out['klavar_staffBottom']=out['klavar_staffBottom']||v;
            else if(txt==='..') out['klavar_staffTop']=v;
          }
        }
      }
    }catch(e){}
    // Fall back to the values already persisted by the range controls.
    try{
      if(!out['klavar_staffBottom']){ const v=localStorage.getItem('klavar_staffBottom'); if(v) out['klavar_staffBottom']=v; }
      if(!out['klavar_staffTop']){ const v=localStorage.getItem('klavar_staffTop'); if(v) out['klavar_staffTop']=v; }
    }catch(e){}
    if(window.__klavarLiveNotes && window.__klavarLiveNotes.length>0){
      out['klavar_notes']=window.__klavarLiveNotes;
    }
    if(window.__klavarLiveStops){
      out['klavar_stops']=window.__klavarLiveStops;
    }
    if(window.__klavarLiveContinues){
      out['klavar_continues']=window.__klavarLiveContinues;
    }
    // Custom barline choices live inside the individual score iframes.
    // Collect them from every printed page so page-2+ choices are included
    // in the saved file as well as page 1 choices.
    try{
      let allBarlineTypes={};
      document.querySelectorAll('#a4-sheet iframe, .a4-extra-page iframe').forEach(function(fr){
        try{
          const doc=fr && fr.contentDocument;
          if(doc && doc.__barlineTypes){
            Object.keys(doc.__barlineTypes).forEach(function(k){ allBarlineTypes[k]=doc.__barlineTypes[k]; });
          }
        }catch(e){}
      });
      // The shared localStorage map is also a useful fallback for a page whose
      // iframe has not finished loading when Save is pressed.
      try{
        const rawBT=localStorage.getItem('klavar_barlineTypes');
        if(rawBT){ const savedBT=JSON.parse(rawBT); if(savedBT && typeof savedBT==='object') Object.keys(savedBT).forEach(function(k){ if(!(k in allBarlineTypes)) allBarlineTypes[k]=savedBT[k]; }); }
      }catch(e){}
      if(Object.keys(allBarlineTypes).length) out['klavar_barlineTypes']=allBarlineTypes;
    }catch(e){}
    return out;
  }

  function applyHeader(){
    try{
      const h=getLiveHeader();
      if(!h) return false;
      const fields=h.querySelectorAll('[contenteditable=\"true\"]');
      const vals=[
        ['klavar_collection','Volume / Collection'],
        ['klavar_title','Title of piece'],
        ['klavar_key','Key'],
        ['klavar_composer','Composer'],
        ['klavar_instructions','Playing instructions'],
        ['klavar_scrollTime','Scroll Time']
      ];
      vals.forEach(([key,def],i)=>{
        const el=fields[i]; if(!el) return;
        const v=localStorage.getItem(key);
        if(v!==null && v!=='') el.textContent=v;
        else if(!(el.innerText||'').trim()) el.textContent=def;
      });
      const st=h.querySelector('.scroll-time');
      if(st){
        const isLong=!!(window.parent && window.parent.document && window.parent.document.body && window.parent.document.body.classList.contains('long-mode'));
        st.style.display=isLong?'block':'none';
      }
      return true;
    }catch(e){ return false; }
  }
  function bindHeaderSaving(){
    try{
      const h=getLiveHeader();
      if(!h) return false;
      const fields=h.querySelectorAll('[contenteditable=\"true\"]');
      const vals=[
        ['klavar_collection','Volume / Collection'],
        ['klavar_title','Title of piece'],
        ['klavar_key','Key'],
        ['klavar_composer','Composer'],
        ['klavar_instructions','Playing instructions'],
        ['klavar_scrollTime','Scroll Time']
      ];
      vals.forEach(([key,def],i)=>{
        const el=fields[i];
        if(!el || el.__klavarHeaderBound) return;
        el.__klavarHeaderBound=true;
        const save=()=>{try{
          const v=(el.innerText!=null?el.innerText:el.textContent||'').replace(/\u00a0/g,' ').trim();
          if(v && v!==def) localStorage.setItem(key,v);
          else localStorage.removeItem(key);
        }catch(e){}};
        el.addEventListener('input',save);
        el.addEventListener('beforeinput',save);
        el.addEventListener('keyup',save);
        el.addEventListener('paste',()=>setTimeout(save,0));
        el.addEventListener('compositionend',save);
        el.addEventListener('blur',save);
        try{const mo=new MutationObserver(()=>save()); mo.observe(el,{subtree:true,childList:true,characterData:true});}catch(e){}
      });
      return true;
    }catch(e){ return false; }
  }
  function applyRange(){
    try{
      const fr=document.querySelector('#a4-sheet iframe');
      if(!fr) return;
      const doc=fr.contentDocument;
      if(!doc) return;
      const bottom=localStorage.getItem('klavar_staffBottom');
      const top=localStorage.getItem('klavar_staffTop');
      if(!bottom && !top) return;
      const sels=Array.from(doc.querySelectorAll('select'));
      const rangeLabel=sels.find(sel=>{
        const prev=sel.previousElementSibling;
        return prev && prev.textContent && prev.textContent.trim()==='Range:';
      });
      if(!rangeLabel) return;
      const topSel=rangeLabel.nextElementSibling && rangeLabel.nextElementSibling.tagName==='SPAN'
        ? rangeLabel.nextElementSibling.nextElementSibling : null;
      if(bottom && rangeLabel.value!==bottom){
        rangeLabel.value=bottom;
        rangeLabel.dispatchEvent(new Event('change',{bubbles:true}));
      }
      if(top && topSel && topSel.value!==top){
        topSel.value=top;
        topSel.dispatchEvent(new Event('change',{bubbles:true}));
      }
    }catch(e){}
  }
  function restoreAll(obj){
    Object.keys(obj).forEach(k=>{
      if(!k.startsWith('klavar_')) return;
      try{ localStorage.setItem(k, typeof obj[k]==='string'?obj[k]:JSON.stringify(obj[k])); }catch(e){}
    });
  }
      window.__klavarRefreshFirstPage = function(v){ try{ localStorage.setItem('klavar_beatSpacing','30'); }catch(e){} 
    try{
      var f = document.querySelector('#a4-sheet iframe');
      if(!f) return;
      v = parseInt(v,10); if(isNaN(v)||v<0) v=0;
      var off = v-1;
      try{ var fs=document.querySelector('#a4-sheet'); if(fs&&fs.dataset) fs.dataset.offset=String(off); }catch(e){}
      try{ localStorage.setItem('klavar_firstPageStart', String(v)); }catch(e){}
      try{
        var src = window.__klavarFirstPageOriginalSrcdoc;
        if(!src) src = window.__klavarBlankSrcDoc;
        if(!src) return;
        // Only update cum and mpc, preserve all scaling (Je/dr/width)
        try{ src = src.replace(/let __cum=\d+,xp=\[\];/, 'let __cum='+off+',xp=[];'); src = src.replace(/let __cum=\d+,xp=\[\];/, 'let __cum='+off+',xp=[];'); }catch(e){}
        try{
          var storedMpc = JSON.parse(localStorage.getItem('klavar_measuresPerCol')||'[]');
          if(Array.isArray(storedMpc) && storedMpc.length>0){
            src=src.replace(/let __mpc=\([^;]+\);/, 'let __mpc='+JSON.stringify(storedMpc)+';');
          }
        }catch(e){}
        f.srcdoc = src;
        try{ window.__klavarSaveExtraPages && window.__klavarSaveExtraPages(); }catch(e){}
        return;
      }catch(e){ console.warn(e); }
    }catch(e){ console.warn(e); }
  };
  setInterval(function(){
    try{
      var f = document.querySelector('#a4-sheet iframe');
      if(f && !f.__klavarRefreshStartMeasure){
        f.__klavarRefreshStartMeasure = function(v){ try{ window.__klavarRefreshFirstPage(v); }catch(e){} }
      }
    }catch(e){}
  }, 800);


  function newScoreClean(){
    if(!confirm('Create new empty score? This will remove extra pages and clear measures.')) return;
    try{
      document.querySelectorAll('.a4-extra-page').forEach(function(el){ el.remove(); });
      try{ localStorage.removeItem('klavar_extraPages'); }catch(e){}
      try{ window.__klavarSaveExtraPages && window.__klavarSaveExtraPages(); }catch(e){}
      try{
        // Blank score: clear all measure data
        var keysToRemove=[];
        for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf('klavar_')===0) keysToRemove.push(k); }
        keysToRemove.forEach(function(k){
          if(k==='klavar_beatSpacing' || k==='klavar_colCount' || k==='klavar_measuresPerCol') return;
          localStorage.removeItem(k);
        });
        // Reset header/title area to defaults
        localStorage.setItem('klavar_collection','Volume / Collection');
        localStorage.setItem('klavar_title','Title of piece');
        localStorage.setItem('klavar_key','Key');
        localStorage.setItem('klavar_composer','Composer');
        localStorage.setItem('klavar_instructions','Playing instructions');
        localStorage.setItem('klavar_scrollTime','Scroll Time');
        // Empty measures - create blank page of empty measures (36 empty)
        var emptyMeasures=[];
        for(var m=1;m<=36;m++){ emptyMeasures.push({m:m, beats:4, notes:[]}); }
        localStorage.setItem('klavar_measures', JSON.stringify(emptyMeasures));
        localStorage.setItem('klavar_measuresPerCol', JSON.stringify([9,9,9,9]));
        localStorage.setItem('klavar_colCount','3');
        // Clear first page offset
        var first = document.querySelector('#a4-sheet');
        if(first && first.dataset) first.dataset.offset='0';
        localStorage.removeItem('klavar_firstPageStart');
        localStorage.removeItem('klavar_firstPageStartMeasure');
      }catch(e){ console.warn(e); }
      setTimeout(function(){ location.reload(); }, 400);
    }catch(e){ console.warn(e); }
  }
  function addBar(){
    if(document.getElementById('klavar-save-bar')) return;
    var bar=document.createElement('div');
    bar.id='klavar-save-bar';
    bar.style.cssText='position:fixed!important;top:18px!important;right:auto!important;z-index:2147483647!important;display:flex!important;gap:8px!important;background:#723D6B!important;border:2px solid #000!important;padding:10px!important;border-radius:10px!important;box-shadow:0 8px 24px rgba(0,0,0,.4)!important;';
    var bn=document.createElement('button');
    bn.textContent='New Score';
    bn.title='New empty score - removes extra pages';
    bn.style.cssText='padding:10px 16px!important;background:#16a34a!important;color:#fff!important;border:0!important;border-radius:8px!important;font-weight:600!important;';
    bn.onclick=newScoreClean;
    bar.appendChild(bn);
    var b1=document.createElement('button');
    b1.textContent='💾 Save';
    b1.style.cssText='padding:10px 16px!important;background:#2563eb!important;color:#fff!important;border:0!important;border-radius:8px!important;font-weight:400!important;';
    b1.onclick=function(){
      try{
        try{
          const h=getLiveHeader();
          const title=h ? h.querySelector('[contenteditable=\"true\"]') : null;
          if(title){ const v=(title.innerText!=null?title.innerText:title.textContent||'').replace(/\u00a0/g,' ').trim(); if(v && v!=='Title') localStorage.setItem('klavar_title',v); }
        }catch(e){}
        var all=getAll();
        if(!all.klavar_notes || all.klavar_notes.length===0){
          alert('No notes to save yet. The score is still demo. Edit notes first - drag or add notes, then Save will capture '+ (window.__klavarLiveNotes?window.__klavarLiveNotes.length+' notes':'0') );
          console.log('Live notes', window.__klavarLiveNotes);
          return;
        }
        var data={v:7, klavarData:all, savedAt:new Date().toISOString()};
        var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a'); a.href=url; a.download='klavar-FULL-'+Date.now()+'.json';
        document.body.appendChild(a); a.click(); setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);},800);
        b1.textContent='✓ '+all.klavar_notes.length+' notes saved';
        setTimeout(()=>b1.textContent='💾 Save',2000);
      }catch(e){alert(e.message);}
    };
    var b2=document.createElement('button');
    b2.textContent='📂 Load';
    b2.style.cssText='padding:10px 16px!important;background:#16a34a!important;color:#fff!important;border:0!important;border-radius:8px!important;font-weight:400!important;';
    b2.onclick=function(){
      var inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange=function(ev){
        var f=ev.target.files[0];
        try{ localStorage.removeItem('klavar_barlineTypes'); localStorage.removeItem('klavar_measuresPerCol_backup'); window.__finalMeasure=null; try{window.parent.__finalMeasure=null;}catch(e){} }catch(e){}
 if(!f) return;
        var rd=new FileReader();
        rd.onload=function(e){
          try{
            var d=JSON.parse(e.target.result);
            var payload=d.klavarData||d;
            if(d.hairpins) payload={klavar_hairpins:d.hairpins};
            if(Array.isArray(d)&&d[0]&&d[0].note) payload={klavar_notes:d};
            // Persist imported title-block values before the reload. The title block
            // belongs to the outer A4 sheet, not to the score iframe.
            try{
              const titleKeys=['klavar_collection','klavar_title','klavar_key','klavar_composer','klavar_instructions','klavar_scrollTime'];
              titleKeys.forEach(k=>{
                if(Object.prototype.hasOwnProperty.call(payload,k)){
                  const v=payload[k];
                  if(v!==null && v!==undefined && String(v).trim()!=='') localStorage.setItem(k,String(v));
                }
              });
            }catch(e){}
            // A loaded score is a new score: clear score-specific display state
            // from the previously loaded score before applying the new score.
            // If the file itself contains that state, restoreAll(payload) below
            // will put it back; otherwise the new score starts clean.
            try{
              Object.keys(localStorage).forEach(k=>{
                if(k.indexOf('klavar_anacrusis_line_')===0 ||
                   k.indexOf('klavar_anacrusis_measure_number_')===0 ||
                   k.indexOf('klavar_anacrusis_visibility_')===0 ||
                   k.indexOf('klavar_anacrusis_snapshot_')===0 ||
                   k.indexOf('klavar_anacrusis_pickup_')===0 ||
                   k==='klavar_manualBeatNums' ||
                   k==='klavar_stops' ||
                   k==='klavar_barlineTypes' ||
                   k==='klavar_measures' ||
                   k==='klavar_beats' ||
                   k==='klavar_timeSigs'){
                  localStorage.removeItem(k);
                }
              });
            }catch(e){}
            restoreAll(payload);
            alert('Loaded '+Object.keys(payload).join(', ')+' ('+(payload.klavar_notes?payload.klavar_notes.length+' notes':'')+') - reloading to apply score');
            setTimeout(()=>location.reload(),600);
          }catch(err){alert(err.message);}
        };
        rd.readAsText(f);
      };
      inp.click();
    };
    var b3=document.createElement('button');
    b3.textContent='🤖 AI Dictation/Import';
    b3.style.cssText='padding:10px 16px!important;background:#7c3aed!important;color:#fff!important;border:0!important;border-radius:8px!important;font-weight:400!important;';
    b3.onclick=function(){ openImportDialog(); };
    bar.appendChild(b1); bar.appendChild(b2); bar.appendChild(b3);
    (document.body||document.documentElement).appendChild(bar);
  }

  function openImportDialog(){
    if(document.getElementById('import-measure-dialog')) return;
    var dlg=document.createElement('div');
    dlg.id='import-measure-dialog';
    dlg.style.cssText='position:fixed!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%)!important;z-index:2147483647!important;background:#723D6B!important;color:#A2FFCC!important;border:2px solid #A2FFCC!important;padding:20px!important;border-radius:12px!important;box-shadow:0 12px 32px rgba(0,0,0,.5)!important;width:900px!important;max-width:95vw!important;max-height:92vh!important;overflow:auto!important;';
    dlg.innerHTML=`
      <h3 style="margin:0 0 8px;font-weight:400;font-size:18px;color:#A2FFCC!important;">Import Measure from AI JSON</h3>
      <p style="font-size:12px;line-height:1.45;margin:0 0 12px;color:#A2FFCC!important;">Paste the JSON copied from the AI chat, or choose a JSON file. The measure is shown in a table for confirmation before anything is imported.</p>
      <div style="padding:10px;border:1px solid #aaa;border-radius:8px;background:#f7f7f7;">

        <textarea id="measure-json-paste" placeholder="Paste the complete JSON here..." style="width:100%;height:150px;box-sizing:border-box;padding:10px;border:1px solid #999;border-radius:6px;font-family:monospace;font-size:9px;line-height:1.35;resize:vertical;color:#000!important;background:#fff!important;"></textarea>
        <div style="display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap;">
