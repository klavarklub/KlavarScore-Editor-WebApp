        <button id="measure-confirm-import" disabled style="padding:9px 14px;background:#16a34a;color:#fff;border:0;border-radius:7px;font-weight:700;opacity:.45;">Confirm Import</button>
        <button id="ai-close-instructions" style="padding:9px 14px;background:transparent!important;color:#A2FFCC!important;border:1px solid #A2FFCC!important;border-radius:7px;font-weight:700;">Cancel</button>
      </div>`;
    document.body.appendChild(dlg);

    var instructions=`You are a piano notation dictation-to-JSON converter.

I will SPEAK the notes of one measure. Convert my description into precise JSON for my KlavarScore editor.

Required top-level structure:
{
  "notes": [],
  "stops": [],
  "beams": [],
  "slurs": []
}

For every note, use an object with:
- "hand": "RH" or "LH"
- "note": pitch using sharp notation only, such as "C4", "D#5", or "A#4"
- "duration": whole, half, quarter, eighth, sixteenth, thirty-second, or sixty-fourth
- "beat": exact starting beat, such as 1, 1.5, 1.75, 2, etc.
- "m": 0 for the measure being described
- "id": a unique string

Rests go in the notes array as {"rest":true,...} and must preserve hand, duration, beat, m, and id.
IMPORTANT ACCIDENTAL RULE: The notation editor understands sharp notation, but it does NOT understand a lowercase "b" as a flat sign. Therefore, convert every flat to its enharmonic sharp equivalent before writing the JSON. Use A# for B-flat, D# for E-flat, G# for A-flat, C# for D-flat, and F# for G-flat. For example, write "A#3" instead of "Bb3" and "D#4" instead of "Eb4". Never output note names such as Bb, Eb, Ab, Db, or Gb. Do not invent or omit accidentals. If I say all Bs or Es are flat, apply the appropriate sharp equivalent to every applicable note.

Articulations may include staccato, accent, marcato, tenuto, fermata, ppp, pp, p, mp, mf, f, ff, fff, sfz, sf, cresc., decresc., and dim.

Beams are objects such as {"hand":"RH","noteIds":["id1","id2"]}. Include exactly the notes specified.
Slurs are objects such as {"hand":"RH","noteIds":["id1","id2"]}. Slurs may contain BOTH hands; use "hand":"BOTH" for mixed-hand groups.
Stops are objects in the stops array, preserving their beat, note, and hand when stated.

Do not invent notes, rests, accidentals, beams, slurs, articulations, or stops. Keep separate beam and slur groups separate. Return valid JSON only, with no Markdown fences or explanation. The notes array is mandatory.`;
    dlg.querySelector('#ai-dictation-instructions').value=instructions;

    var parsed=null;
    function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function normalizePayload(obj){
      var payload=obj&&obj.klavarData?obj.klavarData:obj;
      if(!payload || !Array.isArray(payload.notes)) throw new Error('The JSON must contain a notes array.');
      return payload;
    }
    function previewText(text){
      try{
        var obj=JSON.parse(text);
        parsed=normalizePayload(obj);
        var notes=parsed.notes;
        var html='<div style="font-weight:400;font-size:14px;margin-bottom:7px;">Preview — '+notes.length+' note/rest entries</div>';
        html+='<div style="overflow:auto;border:1px solid #999;border-radius:7px;max-height:330px;"><table style="border-collapse:collapse;width:100%;font-size:12px;background:#fff;"><thead><tr style="background:#eee;position:sticky;top:0;"><th style="padding:6px;border:1px solid #ccc;">#</th><th style="padding:6px;border:1px solid #ccc;">Hand</th><th style="padding:6px;border:1px solid #ccc;">Note / Rest</th><th style="padding:6px;border:1px solid #ccc;">Beat</th><th style="padding:6px;border:1px solid #ccc;">Duration</th><th style="padding:6px;border:1px solid #ccc;">Articulations</th></tr></thead><tbody>';
        notes.forEach(function(n,i){
          var pitch=n.rest?'REST':(n.note||'');
          var arts=Array.isArray(n.articulations)?n.articulations.join(', '):(n.articulations||'');
          html+='<tr><td style="padding:5px;border:1px solid #ddd;text-align:center;">'+(i+1)+'</td><td style="padding:5px;border:1px solid #ddd;text-align:center;font-weight:700;">'+esc(n.hand||'')+'</td><td style="padding:5px;border:1px solid #ddd;font-weight:700;">'+esc(pitch)+'</td><td style="padding:5px;border:1px solid #ddd;text-align:center;">'+esc(n.beat)+'</td><td style="padding:5px;border:1px solid #ddd;">'+esc(n.duration)+'</td><td style="padding:5px;border:1px solid #ddd;">'+esc(arts)+'</td></tr>';
        });
        html+='</tbody></table></div>';
        var groups=[];
        if(Array.isArray(parsed.beams)&&parsed.beams.length) groups.push('Beams: '+parsed.beams.length);
        if(Array.isArray(parsed.slurs)&&parsed.slurs.length) groups.push('Slurs: '+parsed.slurs.length);
        if(Array.isArray(parsed.stops)&&parsed.stops.length) groups.push('Stops: '+parsed.stops.length);
        if(groups.length) html+='<div style="margin-top:8px;padding:8px;background:#f3f4f6;border:1px solid #ddd;border-radius:6px;font-size:12px;"><b>Additional notation:</b> '+esc(groups.join('  •  '))+'</div>';
        var pre=dlg.querySelector('#measure-json-preview'); pre.innerHTML=html; pre.style.display='block';
        dlg.querySelector('#measure-json-status').textContent='JSON parsed successfully. Review the table before confirming.';
        var btn=dlg.querySelector('#measure-confirm-import'); btn.disabled=false; btn.style.opacity='1';
      }catch(err){
        parsed=null;
        var pre=dlg.querySelector('#measure-json-preview'); pre.style.display='none'; pre.innerHTML='';
        dlg.querySelector('#measure-json-status').textContent='Invalid JSON: '+err.message;
        var btn=dlg.querySelector('#measure-confirm-import'); btn.disabled=true; btn.style.opacity='.45';
      }
    }
    dlg.querySelector('#measure-parse-paste').onclick=function(){ previewText(dlg.querySelector('#measure-json-paste').value); };
    dlg.querySelector('#measure-json-file').onchange=function(ev){
      var f=ev.target.files&&ev.target.files[0]; if(!f)return;
      var rd=new FileReader(); rd.onload=function(e){ previewText(e.target.result); }; rd.readAsText(f);
    };
    function getTargetMeasure(){
      try{
        var fr=document.querySelector('#a4-sheet iframe'), d=fr&&fr.contentDocument;
        var el=d&&d.querySelector('text.measure-num.mn-selected');
        if(el){ var n=parseInt((el.textContent||'').trim(),10); if(Number.isFinite(n)) return n-1; }
      }catch(e){}
      var answer=prompt('Import into which measure number?','1');
      var n=parseInt(answer,10); return Number.isFinite(n)&&n>=1?n-1:null;
    }
    dlg.querySelector('#measure-confirm-import').onclick=function(){
      if(!parsed)return;
      var target=getTargetMeasure(); if(target===null)return;
      try{
        var existing=[]; try{ existing=JSON.parse(localStorage.getItem('klavar_notes')||'[]'); }catch(e){}
        if(!Array.isArray(existing)) existing=[];
        var prefix='imp-'+Date.now()+'-';
        var imported=[]; var idMap={};
        function editorPitch(pitch){
          // Import accepts either flat or sharp spellings, while the editor's
          // internal pitch parser accepts sharp notation. Convert flats to
          // their enharmonic sharp equivalents only during Import Measure.
          if(typeof pitch!=='string') return pitch;
          var s=pitch.trim().replace(/[♭]/g,'b').replace(/[♯]/g,'#');
          var m=s.match(/^([A-Ga-g])b(\d+)$/);
          if(!m) return s;
          var map={Cb:'B',Db:'C#',Eb:'D#',Fb:'E',Gb:'F#',Ab:'G#',Bb:'A#'};
          var key=m[1].toUpperCase()+'b';
          return (map[key]||m[1].toUpperCase()+'b')+m[2];
        }
        parsed.notes.forEach(function(n,i){
          if(n.rest) return; // The editor represents rests by the absence of a note at that beat; keep rests in the preview but never store an invalid note object.
          if(!n.note) return;
          var id=prefix+(n.id||i); idMap[n.id||i]=id;
          var x=Object.assign({},n); x.note=editorPitch(x.note); x.id=id; x.m=target; x.articulations=Array.isArray(x.articulations)?x.articulations:[];
          imported.push(x);
        });
        existing=existing.filter(function(n){return Number(n.m)!==target;}).concat(imported);
        localStorage.setItem('klavar_notes',JSON.stringify(existing));

        function mapEndpoint(x, side){
          var id=x[side+'Id']; if(id!=null && idMap[id]!=null) return idMap[id];
          var ids=Array.isArray(x.noteIds)?x.noteIds:[];
          if(side==='start' && ids.length) return idMap[ids[0]]||null;
          if(side==='end' && ids.length) return idMap[ids[ids.length-1]]||null;
          return null;
        }
        ['beams','slurs'].forEach(function(kind){
          var arr=Array.isArray(parsed[kind])?parsed[kind]:[];
          var mapped=[];
          arr.forEach(function(x,i){
            var a=mapEndpoint(x,'start'), b=mapEndpoint(x,'end'); if(!a||!b)return;
            var na=imported.find(function(n){return n.id===a;}), nb=imported.find(function(n){return n.id===b;}); if(!na||!nb)return;
            mapped.push({id:prefix+kind+'-'+i,hand:x.hand||na.hand,startId:a,endId:b,startM:target,startBeat:na.beat,startNote:na.note,endM:target,endBeat:nb.beat,endNote:nb.note,noteIds:Array.isArray(x.noteIds)?x.noteIds.map(function(id){return idMap[id]||id;}):[a,b],__importedBeamDefault:true});
          });
          localStorage.setItem('klavar_'+kind,JSON.stringify((JSON.parse(localStorage.getItem('klavar_'+kind)||'[]')||[]).filter(function(x){return Number(x.startM)!==target&&Number(x.endM)!==target&&Number(x.m)!==target;}).concat(mapped)));
        });
        var stops=Array.isArray(parsed.stops)?parsed.stops:[];
        var mappedStops=stops.filter(function(x){return x.note;}).map(function(x,i){return {id:prefix+'stop-'+i,m:target,beat:x.beat,note:editorPitch(x.note),hand:x.hand||'LH'};});
        var oldStops=[]; try{oldStops=JSON.parse(localStorage.getItem('klavar_stops')||'[]');}catch(e){}
        localStorage.setItem('klavar_stops',JSON.stringify((Array.isArray(oldStops)?oldStops:[]).filter(function(x){return Number(x.m)!==target;}).concat(mappedStops)));
        var cont=Array.isArray(parsed.continues)?parsed.continues:[];
        var mappedCont=cont.map(function(x,i){return Object.assign({},x,{id:prefix+'continue-'+i,oldId:idMap[x.oldId]||x.oldId,newId:idMap[x.newId]||x.newId,oldM:target,newM:target});});
        var oldCont=[]; try{oldCont=JSON.parse(localStorage.getItem('klavar_continues')||'[]');}catch(e){}
        localStorage.setItem('klavar_continues',JSON.stringify((Array.isArray(oldCont)?oldCont:[]).filter(function(x){return Number(x.oldM)!==target&&Number(x.newM)!==target;}).concat(mappedCont)));
        dlg.remove();
        alert('Imported '+imported.length+' note entries into measure '+(target+1)+'. Rests were retained in the preview and not stored as note objects. Reloading to apply the import.');
        setTimeout(function(){location.reload();},300);
      }catch(err){ alert('Import failed: '+err.message); }
    };
    dlg.querySelector('#ai-copy-instructions').onclick=function(){
      var ta=dlg.querySelector('#ai-dictation-instructions'); ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){dlg.querySelector('#ai-copy-instructions').textContent='Copied';setTimeout(function(){dlg.querySelector('#ai-copy-instructions').textContent='Copy Instructions';},1200);}).catch(function(){document.execCommand('copy');});}catch(e){try{document.execCommand('copy');}catch(_){} }
    };
    dlg.querySelector('#ai-close-instructions').onclick=function(){dlg.remove();};
  }

  function restoreSavedBarlineTypes(){
    try{
      const raw=localStorage.getItem('klavar_barlineTypes');
      if(!raw) return false;
      const saved=JSON.parse(raw);
      if(!saved || typeof saved!=='object') return false;
      const frames=Array.from(document.querySelectorAll('#a4-sheet iframe, .a4-extra-page iframe'));
      let restoredAny=false;
      frames.forEach(function(fr){
        try{
          const doc=fr && fr.contentDocument;
          const picker=doc && doc.getElementById('barline-type-picker');
          if(!doc || !picker || !doc.__barlineTypes) return;
          if(doc.__savedBarlineTypesRestored) return;
          doc.__savedBarlineTypesRestored=true;
          doc.__barlineTypes={};
          const entries=Object.entries(saved);
          entries.forEach(([measure,type])=>{
            // Only replay choices for measures actually present in this page's
            // score. This avoids making page 1 try to draw page-2 barlines and
            // vice versa while still restoring the shared logical map.
            const hasMeasure=Array.from(doc.querySelectorAll('text.measure-num')).some(function(el){ return (el.textContent||'').trim()===String(measure); });
            if(!hasMeasure) return;
            let types = Array.isArray(type) ? type : [type];
            types.forEach(t=>{
              const btn=picker.querySelector('button[data-type="'+t+'"]');
              if(!btn) return;
              picker.dataset.measure=measure;
              try{ btn.click(); }catch(e){}
            });
          });
          picker.classList.remove('show');
          doc.querySelectorAll('text.measure-num.mn-selected').forEach(el=>el.classList.remove('mn-selected'));
          // Keep the complete score-wide map available to this page's document.
          // The renderer and later edits can therefore see the same persisted state.
          doc.__barlineTypes=JSON.parse(JSON.stringify(saved));
          restoredAny=true;
        }catch(e){}
      });
      return restoredAny;
    }catch(e){ return false; }
  }

  function init(){
    applyHeader();
    bindHeaderSaving();
    applyRange();
    addBar();
    const fr=document.querySelector('#a4-sheet iframe');
    if(fr && !fr.__klavarSaveLoadBound){
      fr.__klavarSaveLoadBound=true;
      fr.addEventListener('load',()=>{
        setTimeout(()=>{ applyRange(); applyHeader(); bindHeaderSaving(); restoreSavedBarlineTypes(); },50);
        setTimeout(()=>{ applyRange(); applyHeader(); bindHeaderSaving(); restoreSavedBarlineTypes(); },500);
        setTimeout(()=>{ restoreSavedBarlineTypes(); },1200);
      });
    }
    setTimeout(()=>{ applyHeader(); bindHeaderSaving(); applyRange(); addBar(); },700);
    setTimeout(()=>{ applyHeader(); bindHeaderSaving(); applyRange(); },1500);
    setTimeout(()=>{ applyHeader(); bindHeaderSaving(); },2500);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.addEventListener('load', init);
  setInterval(()=>{ bindHeaderSaving(); applyRange(); restoreSavedBarlineTypes(); if(!document.getElementById('klavar-save-bar')) addBar(); },3000);
})();

</script>

<script>
(function(){

  }
  function drawSaved(){ return; /* disabled */ } function drawSavedOrig(){

      let hr=document.createElement('div'); hr.className='octLive'; hr.dataset.octId=oc.id; hr.style.position='absolute'; hr.style.left=(xBase-12)+'px'; hr.style.top=(t/800*100)+'%'; hr.style.width='12px'; hr.style.height='1px'; hr.style.zIndex='20'; hr.style.pointerEvents='none'; hr.style.background='repeating-linear-gradient(to right, black 0px, black 6px, transparent 6px, transparent 14px)'; colEl.appendChild(hr);
      let hr2=document.createElement('div'); hr2.className='octLive'; hr2.dataset.octId=oc.id; hr2.style.position='absolute'; hr2.style.left=(xBase-12)+'px'; hr2.style.top=(b/800*100)+'%'; hr2.style.width='12px'; hr2.style.height='1px'; hr2.style.zIndex='20'; hr2.style.pointerEvents='none'; hr2.style.background='repeating-linear-gradient(to right, black 0px, black 6px, transparent 6px, transparent 14px)'; colEl.appendChild(hr2);
      let lbl=document.createElement('div');
      lbl.className='octLive'; lbl.dataset.octId=oc.id;
      lbl.style.position='absolute'; lbl.style.left=(isVb ? (xBase-12)+'px' : (xBase-10)+'px'); lbl.style.top='calc('+(t/800*100)+'% - 2px)';

      lbl.style.fontSize='10px'; lbl.style.fontFamily='"Times New Roman", Times, serif'; lbl.style.fontStyle='italic'; lbl.style.fontWeight='700';
      lbl.style.zIndex='30'; lbl.style.cursor='pointer'; lbl.style.touchAction='none'; lbl.style.userSelect='none'; lbl.style.lineHeight='1';
      lbl.textContent=oc.type + (oc.type==='8vb' ? ' -' : '');
      colEl.appendChild(lbl);
    });
  }
  setInterval(function(){ try{ document.querySelectorAll('.octLive').forEach(el=>el.remove()); document.querySelectorAll('body > .octLive').forEach(el=>el.remove()); }catch(e){} }, 300);
  document.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.octLive')) return;
    document.querySelectorAll('.octLive').forEach(el=>{ 
      el.style.outline='none'; 
      el.style.color='black';
      el.style.borderLeftColor='black';
      el.style.borderTopColor='black';
      el.style.cursor='pointer';

<script id="beat-spacing-compat">
(function(){
  "use strict";

  /*
   * Beat-spacing compatibility layer.
   * The editor's original source remains unchanged on disk.  Instead of
   * visually scaling the finished score, this layer adjusts the existing
   * renderer's own beat-spacing variable in each iframe's srcdoc before
   * that iframe is (re)loaded.
   */
  var STORAGE="klavar_beatSpacing";
  var MPC_STORAGE="klavar_measuresPerCol";
  var MPC_PAGES_STORAGE="klavar_measuresPerColPages";
  var SPACING_PAGES_STORAGE="klavar_beatSpacingPages";
  var DEFAULT_SPACING=30;
  var MIN_SPACING=20;
  var MAX_SPACING=80;
  var STEP=2;
  var CAPACITY=840;

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function spacingToMpc(spacing, pageIndex){
    /* The first/title page has less vertical score space.  Subsequent pages
       have the full score area.  Keep the calculation page-local so changing
       one page never changes another page's measures-per-column value. */
    if(pageIndex>0){
      return clamp(Math.floor(1050/(4*spacing)-0.5),1,9);
    }
    return clamp(Math.floor(CAPACITY/(4*spacing)),1,9);
  }

  function getFramePageIndex(frame){
    /* Page identity is structural, not based on iframe order.  Every iframe
       inside .a4-extra-page is an independent full-score page; its page number
       is taken from that page container first.  This prevents any later page
       from inheriting page 1's measure count through DOM-order fallbacks. */
    try{
      var el=frame;
      var extra=el&&el.closest?el.closest('.a4-extra-page'):null;
      if(extra){
        var pn=extra.dataset&&extra.dataset.pageNumber!=null?parseInt(extra.dataset.pageNumber,10):NaN;
        if(!isNaN(pn) && pn>=2) return pn-1;
      }
    }catch(e){}
    try{
      if(frame && frame.__klavarPageIndex!=null){
        var explicit=parseInt(frame.__klavarPageIndex,10);
        if(!isNaN(explicit) && explicit>=0) return explicit;
      }
    }catch(e){}
    /* The only iframe without an .a4-extra-page ancestor is the main/title page. */
    return 0;
  }

  function getPageMpc(pageIndex, spacing){
    var m=spacingToMpc(pageIndex>0?spacing:spacing,pageIndex);
    return [m,m,m,m];
  }

  function savePageMpc(pageIndex, a){
    try{
      var raw=localStorage.getItem(MPC_PAGES_STORAGE);
      var pages=raw?JSON.parse(raw):[];
      if(!Array.isArray(pages))pages=[];
      pages[pageIndex]=a;
      localStorage.setItem(MPC_PAGES_STORAGE,JSON.stringify(pages));
    }catch(e){}
  }

  function mpcToSpacing(mpc){
    mpc=clamp(parseInt(mpc,10)||7,1,10);
    var raw=CAPACITY/(4*mpc);
    var v=Math.round(raw/STEP)*STEP;
    return clamp(v,MIN_SPACING,MAX_SPACING);
  }

  function getSpacing(frame){
    var page=getFramePageIndex(frame);
    try{
      var raw=localStorage.getItem(SPACING_PAGES_STORAGE);
      var pages=raw?JSON.parse(raw):[];
      if(Array.isArray(pages) && pages[page]!=null){
        var pv=parseInt(pages[page],10);
        if(!isNaN(pv)) return clamp(pv,MIN_SPACING,MAX_SPACING);
      }
    }catch(e){}
    try{
      var vA4=parseInt(localStorage.getItem('klavar_beatSpacing_A4'),10);
      if(!isNaN(vA4)) return clamp(vA4,MIN_SPACING,MAX_SPACING);
    }catch(e){}
    try{
      var v=parseInt(localStorage.getItem(STORAGE),10);
      if(!isNaN(v)) return clamp(v,MIN_SPACING,MAX_SPACING);
    }catch(e){}
    try{
      var a=JSON.parse(localStorage.getItem(MPC_STORAGE)||"null");
      if(Array.isArray(a) && a.length && a[0]!=null) return mpcToSpacing(a[0]);
    }catch(e){}
    return DEFAULT_SPACING;
  }

  function savePageSpacing(pageIndex, spacing){
    try{
      var raw=localStorage.getItem(SPACING_PAGES_STORAGE);
      var pages=raw?JSON.parse(raw):[];
      if(!Array.isArray(pages)) pages=[];
      pages[pageIndex]=clamp(parseInt(spacing,10)||DEFAULT_SPACING,MIN_SPACING,MAX_SPACING);
      localStorage.setItem(SPACING_PAGES_STORAGE,JSON.stringify(pages));
    }catch(e){}
  }

  function setMpcForSpacing(spacing, frame){
    var page=getFramePageIndex(frame);
    var mpc=spacingToMpc(spacing,page);
    var a=[mpc,mpc,mpc,mpc];
    savePageMpc(page,a);
    /* Keep the legacy/global value aligned only with page 1.  Extra pages
       must never overwrite the first page's measure count. */
    if(page===0){ try{ localStorage.setItem(MPC_STORAGE,JSON.stringify(a)); }catch(e){} }
    return mpc;
  }

  function frameList(){
    var a=[];
    try{
      document.querySelectorAll('#a4-sheet > div:last-child iframe, .a4-extra-page iframe').forEach(function(f){ a.push(f); });
    }catch(e){}
    return a;
  }

  /*
   * Patch only the two places in the original renderer that actually define
   * the beat's vertical unit:
   *   1. pn=30  -> pn=<selected spacing>
   *   2. __getBeats(i)*30 -> __getBeats(i)*<selected spacing>
   *
   * We deliberately do not change We, dr, xp, __measuresPerCol, or any of
   * the editor's other layout calculations here.
   */
  function patchSourceForSpacing(src,spacing,frame){
    if(typeof src!=="string" || !src) return src;
    var out=src, pnValue=String(spacing);
    out=out.replace(/(xe=12,pn=)\d+(,We=120,Ne=\d+;)/g,'$1'+pnValue+'$2');
    out=out.replace(/(let MAX_MEAS=10,We=120,pn=)\d+(,Je=)/g,'$1'+pnValue+'$2');
    out=out.replace(/__getBeats\(i\)\*\d+/g,'__getBeats(i)*'+pnValue);

    /* Measures-per-column is calculated independently for each page. */
    var page=getFramePageIndex(frame);
    var isLong = false;
    try{ isLong = !!(window.__isLongMode || (window.parent && window.parent.__isLongMode)); }catch(e){}
    /* FIX for Long View showing only column 1: do NOT overwrite __mpc with [7,7,7] when in long mode.
       Keep the [100] set by toggleLongMode, or force [1000] to show all measures. */
    if(page===0){
      if(isLong){
        try{
          var stored = null;
          try{ stored = JSON.parse(localStorage.getItem('klavar_measuresPerCol')||''); }catch(e){}
          if(Array.isArray(stored) && stored.length===1 && stored[0]>=50){
            var big='['+stored[0]+']';
            out=out.replace(/let __mpc=\([^;]+\);/, 'let __mpc='+big+';');
          } else {
            // ensure at least 500 measures in long view
            out=out.replace(/let __mpc=\([^;]+\);/, 'let __mpc=[500];');
          }
        }catch(e){}
      } else {
        var mpc=getPageMpc(page,spacing);
        var mpcStr='['+mpc.join(',')+']';
        out=out.replace(/let __mpc=\([^;]+\);/, 'let __mpc='+mpcStr+';');
      }
    }
    return out;
  }

  function getPatchSpacing(frame){
    try{
      var isLong=!!window.__isLongMode;
      if(!isLong && window.parent && window.parent!==window) isLong=!!window.parent.__isLongMode;
      if(isLong){
        var ls=parseInt(localStorage.getItem("klavar_beatSpacing_long"),10);
        if(!isFinite(ls)||ls<20) ls=parseInt(localStorage.getItem("klavar_beatSpacing"),10);
        if(isFinite(ls)&&ls>=20) return ls;
      }
    }catch(e){}
    return getSpacing(frame);
  }

  function installSrcdocHook(){
    if(window.__beatSpacingSrcdocHook) return;
    var installed=false;
    try{
      var d=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,'srcdoc');
      if(d && d.set && d.get){
        Object.defineProperty(HTMLIFrameElement.prototype,'srcdoc',{
          configurable:d.configurable, enumerable:d.enumerable, get:d.get,
          set:function(value){
            try{ value=patchSourceForSpacing(value,getPatchSpacing(this),this); }catch(e){}
            return d.set.call(this,value);
          }
        }); installed=true;
      }
    }catch(e){}
    try{
      var oldSetAttribute=Element.prototype.setAttribute;
      if(!Element.prototype.__klavarBeatSetAttributeHook){
        Element.prototype.setAttribute=function(name,value){
          try{
            if(this instanceof HTMLIFrameElement && String(name).toLowerCase()==='srcdoc') value=patchSourceForSpacing(String(value),getPatchSpacing(this),this);
          }catch(e){}
          return oldSetAttribute.call(this,name,value);
        };
        Object.defineProperty(Element.prototype,'__klavarBeatSetAttributeHook',{value:true,configurable:true}); installed=true;
      }
    }catch(e){}
    window.__beatSpacingSrcdocHook=installed;
  }

  function sourceNeedsSpacing(src,spacing){
    if(typeof src!=="string") return false;
    var v=String(spacing);
    return (src.indexOf('xe=12,pn='+v+',We=120')>=0 ||
            src.indexOf('let MAX_MEAS=10,We=120,pn='+v+',Je=')>=0) &&
      src.indexOf('__getBeats(i)*'+v)>=0;
  }

  function patchFrameSource(frame,spacing,forceReload){
    if(!frame) return false;
    var src='';
    try{ src=frame.getAttribute('srcdoc') || frame.srcdoc || ''; }catch(e){}
    if(!src) return false;

    var patched=patchSourceForSpacing(src,spacing,frame);
    if(patched===src){
      frame.__beatSpacingSource=spacing;
      return false;
    }

    try{
      frame.__beatSpacingSource=spacing;
      frame.srcdoc=patched;
      return true;
    }catch(e){
      try{
        frame.setAttribute('srcdoc',patched);
        frame.__beatSpacingSource=spacing;
        return true;
      }catch(e2){}
    }
    return false;
  }

            /* Baby step: place the existing Range controls after the column buttons. */
            try{

  function patchSourceForPageType(src,isBlankPage){
    if(typeof src!=="string" || !src) return src;
    if(isBlankPage){
      src = src.replace(/let __bottomMargin=75;/g,'let __bottomMargin=0;');
      src = src.replace(/dr=Math\.min\(__maxBoxH, __pageContentH - __bottomMargin\);/g,'dr=1080;');
      src = src.replace(/dr=Math\.max\(12\+8\*We\+18, Math\.min\(__maxBoxH, __pageContentH - __bottomMargin\)\);/g,'dr=1080;');
    } else {
      src = src.replace(/dr=Math\.min\(__maxBoxH, __pageContentH - __bottomMargin\);/g, "dr=(window.parent && window.parent.__isLongMode) ? 12000 : Math.min(__maxBoxH, __pageContentH - __bottomMargin);");
      src = src.replace(/dr=Math\.max\(12\+8\*We\+18, Math\.min\(__maxBoxH, __pageContentH - __bottomMargin\)\);/g, "dr=(window.parent && window.parent.__isLongMode) ? 12000 : Math.min(__maxBoxH, __pageContentH - __bottomMargin);");
    }
    src = src.replace(/var off=dr - actualH;/g,'var off=Math.min(20,(dr - actualH)/2);');
    src = src.replace(/var off=\(dr - actualH\)\/2;/g,'var off=Math.min(20,(dr - actualH)/2);');
    return src;
  }

  function applyFrame(frame){
    if(!frame) return;
    var spacing=getPatchSpacing(frame);
    var isBlankPage=false;
    try{ isBlankPage=!!(window.parent && window.parent.document && Array.from(window.parent.document.querySelectorAll('.a4-extra-page iframe')).includes(frame)); }catch(e){}

    /* If React/outer code has supplied a fresh srcdoc, patch that source and
       let its normal iframe load render the score at the real beat spacing. */
    var src='';
    try{ src=frame.getAttribute('srcdoc') || frame.srcdoc || ''; }catch(e){}
    if(src){
      var pagePatched=patchSourceForPageType(src,isBlankPage);
      if(pagePatched!==src){
        try{ frame.setAttribute('srcdoc',pagePatched); return; }catch(e){}
      }
      if(!sourceNeedsSpacing(src,spacing)){
        if(patchFrameSource(frame,spacing,false)) return;
      }
    }

    installToolbar(frame);
    repairToolbarLayout(frame);
    try{ fixColumnHeights(frame); }catch(e){}

    if(!frame.__beatSpacingObserver && frame.contentDocument && frame.contentDocument.body){
      try{
        frame.__beatSpacingObserver=new MutationObserver(function(){
          clearTimeout(frame.__beatSpacingTimer);
          frame.__beatSpacingTimer=setTimeout(function(){
            try{ installToolbar(frame); repairToolbarLayout(frame); fixColumnHeights(frame); }catch(e){}
          },30);
        });
        frame.__beatSpacingObserver.observe(frame.contentDocument.body,{childList:true,subtree:true});
      }catch(e){}
    }
  }

  function watchFrame(frame){
    if(!frame || frame.__beatSpacingWatched) return;
    frame.__beatSpacingWatched=true;
    frame.addEventListener('load',function(){
      setTimeout(function(){ applyFrame(frame); },20);
      setTimeout(function(){ applyFrame(frame); },150);
      setTimeout(function(){ applyFrame(frame); },500);
    });
    applyFrame(frame);
  }

  function scan(){ frameList().forEach(watchFrame); }

  installSrcdocHook();
  scan();
  var outerObserver=new MutationObserver(function(records){
    records.forEach(function(rec){
      if(rec.type==='attributes' && rec.target && rec.target.tagName==='IFRAME' && String(rec.attributeName).toLowerCase()==='srcdoc'){
        try{ var fr=rec.target, raw=fr.getAttribute('srcdoc')||'', patched=patchSourceForSpacing(raw,getPatchSpacing(fr),fr); if(patched!==raw) fr.setAttribute('srcdoc',patched); }catch(e){}

(function(){
  // Final title restoration guard: React may recreate or overwrite the iframe
  // header after the iframe load event. Keep the saved values authoritative.
  function restore(){
    try{
      var fr=document.querySelector('#a4-sheet iframe');
      var d=fr && fr.contentDocument;
      var h=d && d.querySelector('#score-title-wide');
      if(!h) return false;
      var fields=h.querySelectorAll('[contenteditable="true"]');
      var keys=['klavar_collection','klavar_title','klavar_key','klavar_composer','klavar_instructions','klavar_scrollTime'];
      var defs=['Volume / Collection','Title of piece','Key','Composer','Playing instructions','Scroll Time'];
      for(var i=0;i<3;i++){
        var v=localStorage.getItem(keys[i]);
        if(fields[i] && v!==null && v!==''){
          var cur=(fields[i].innerText||fields[i].textContent||'').replace(/\u00a0/g,' ').trim();
          if(cur!==v && d.activeElement!==fields[i]) fields[i].textContent=v;
        }else if(fields[i] && !(fields[i].innerText||'').trim()){
          fields[i].textContent=defs[i];
        }
      }
      if(!fr.__titleGuardInstalled){
        fr.__titleGuardInstalled=true;
        var restoreTimer=null;
        var mo=new MutationObserver(function(){
          clearTimeout(restoreTimer);
          restoreTimer=setTimeout(function(){
            // Never overwrite a field while the user is actively editing it.
            var active=d.activeElement;
            if(active && active.getAttribute && active.getAttribute('contenteditable')==='true') return;
            if(!fr.__titleGuardBusy){
              fr.__titleGuardBusy=true;
              try{restore();}finally{fr.__titleGuardBusy=false;}
            }
          },350);
        });
        if(d.documentElement) mo.observe(d.documentElement,{subtree:true,childList:true,characterData:true});
        fr.addEventListener('load',function(){setTimeout(restore,0);setTimeout(restore,100);setTimeout(restore,500);});
      }
      return true;
    }catch(e){return false;}
  }
  var n=0;
  var timer=setInterval(function(){n++; restore(); if(n>300) clearInterval(timer);},50);
  restore();
})();
</script>

    let panel=document.createElement('div');
    panel.id='finger-panel';
    panel.style.cssText='position:fixed;right:12px;top:85px;width:280px;max-height:70vh;overflow:auto;background:#fff;border:1px solid rgba(0,0,0,0.15);border-radius:10px;padding:10px;z-index:9999;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);';
    let header=document.createElement('div');
    header.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;';
    let left=document.createElement('div');
    left.style.cssText='display:flex;align-items:center;gap:6px;';
    let prev=document.createElement('button');
    prev.textContent='◀';
    prev.style.cssText='border:1px solid #ddd;border-radius:6px;padding:4px 8px;background:#fff;cursor:pointer;';
    let next=document.createElement('button');
    next.textContent='>';
    next.style.cssText='border:1px solid #ddd;border-radius:6px;padding:4px 8px;background:#fff;cursor:pointer;';
    let mLabel=document.createElement('span');
    mLabel.style.cssText='font-weight:700;';
    mLabel.textContent='Measure '+(currentM+1);
    left.appendChild(prev);
    left.appendChild(mLabel);
    left.appendChild(next);
    let close=document.createElement('button');
    close.textContent='x';
    close.style.cssText='border:1px solid #ddd;border-radius:6px;padding:2px 8px;background:#fff;';
    header.appendChild(left);
    header.appendChild(close);
    panel.appendChild(header);

    function changeM(delta){
      let maxM=0;
      notes.forEach(function(n){ if(n.m>maxM) maxM=n.m; });
      currentM=Math.max(0, Math.min(maxM, currentM+delta));
      try{ localStorage.setItem('klavar_currentMeasure', String(currentM)); }catch(e){}
      buildPanel();
    }
    prev.addEventListener('click', function(){ changeM(-1); });
    next.addEventListener('click', function(){ changeM(1); });
    close.addEventListener('click', function(){
      try{ localStorage.setItem('klavar_showFingers','0'); let cb=document.getElementById('finger-toggle'); if(cb) cb.checked=false; }catch(e){}
      panel.remove();
    });

    let rh=notes.filter(function(n){ return n.hand==='RH' && n.m===currentM; }).slice().sort(function(a,b){ return a.beat-b.beat; });
    let lh=notes.filter(function(n){ return n.hand==='LH' && n.m===currentM; }).slice().sort(function(a,b){ return a.beat-b.beat; });

    function addSection(label, list){
      let h=document.createElement('div');
      h.style.cssText='font-weight:600;margin:10px 0 4px 0;opacity:0.8;';
      h.textContent=label;
      panel.appendChild(h);
      if(list.length===0){
        let empty=document.createElement('div');
        empty.style.cssText='opacity:0.5;padding:4px 0;';
        empty.textContent='(no notes)';
        panel.appendChild(empty);
        return;
      }
      list.forEach(function(n){
        let row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f3f3f3;';
        let lab=document.createElement('span');
        lab.style.cssText='flex:1;display:flex;align-items:center;gap:6px;';
        let dot=document.createElement('span');
        dot.style.cssText='display:inline-flex;width:18px;height:18px;border-radius:50%;background:'+(fingers[n.id]?'#fde68a':'#f3f4f6')+';color:'+(fingers[n.id]?'#92400e':'#9ca3af')+';align-items:center;justify-content:center;font-weight:700;font-size:10px;border:1px solid '+(fingers[n.id]?'#f59e0b':'#723D6B')+';';
        dot.textContent=fingers[n.id]||'';
        lab.appendChild(dot);
        let t=document.createElement('span');
        t.textContent=n.beat.toFixed(2)+'  '+n.note;
        lab.appendChild(t);
        let sel=document.createElement('select');
        sel.style.cssText='width:52px;border:1px solid #ccc;border-radius:6px;padding:3px;';
        ['', '1','2','3','4','5'].forEach(function(o){
          let op=document.createElement('option');
          op.value=o; op.textContent=o===''?'—':o;
          if(fingers[n.id] && String(fingers[n.id])===o) op.selected=true;
          sel.appendChild(op);
        });
        sel.addEventListener('change', function(){
          setFinger(n.id, sel.value);
          // auto-advance within measure
          if(sel.value!==''){
            let all=Array.from(panel.querySelectorAll('select'));
            let idx=all.indexOf(sel);
            if(idx>=0 && idx+1<all.length){
              all[idx+1].focus();
            } else {
              // end of measure -> go next measure
              changeM(1);
            }
          }
        });
        row.appendChild(lab);
        row.appendChild(sel);
        panel.appendChild(row);
      });
    }
    addSection('RH', rh);
    addSection('LH', lh);
    document.body.appendChild(panel);
  }
  setInterval(function(){
    let panel=document.getElementById('finger-panel');
    let should=false;
    try{ should=localStorage.getItem('klavar_showFingers')==='1'; }catch(e){}
    if(should && !panel) buildPanel();
    if(!should && panel) panel.remove();
  }, 800);
})();
</script>

<script>
(function(){
  function force(el, prop, val){ try{ el.style.setProperty(prop, val, 'important'); }catch(e){} }
  function fix(initial){
    try{
      document.querySelectorAll('iframe').forEach(function(f){
        force(f, 'background', '#723D6B');
        f.style.backgroundColor='#723D6B';
      });

      document.querySelectorAll('iframe').forEach(function(redFrame, idx){
        if(!redFrame.contentDocument) return;
        var rd = redFrame.contentDocument;
        var rp = rd.getElementById('printable-a4');
        if(!rp) return;
        var rc = rp.querySelector('div:last-child');
        var scoreFlex = rd.querySelector('div.mt-4.flex');
        var title = rd.getElementById('score-title-wide');
        if(!scoreFlex || !rc) return;

        if(rd.documentElement){
          rd.documentElement.style.background='#723D6B';
          force(rd.documentElement, 'background', '#723D6B');
        }
        rd.body.style.background='#723D6B';
        force(rd.body, 'background', '#723D6B');
        force(rd.body, 'margin', '0');
        force(rd.body, 'padding', '0');

        force(rp, 'display', 'block');
        force(rp, 'position', 'relative');
        force(rp, 'height', '380mm');
        force(rp, 'min-height', '380mm');
        force(rp, 'max-height', '380mm');
        force(rp, 'overflow-y', 'auto');
        force(rp, 'overflow-x', 'hidden');
        rp.style.border='none';
        rp.style.background='white';
        rp.style.boxSizing='border-box';
        force(rp, 'padding-top', '6mm');
        force(rp, 'scroll-padding-top', '6mm');

        if(title){
          force(title, 'display', 'block');
          force(title, 'position', 'relative');
          force(title, 'margin-top', '4mm');
          force(title, 'padding-top', '2mm');
          force(title, 'background', 'white');
        }

        force(rc, 'display', 'block');
        force(rc, 'overflow', 'visible');
        force(scoreFlex, 'display', 'flex');
        force(scoreFlex, 'flex-wrap', 'wrap');
        force(scoreFlex, 'overflow', 'visible');
        scoreFlex.style.border='none';
        scoreFlex.style.background='white';
        force(scoreFlex, 'padding', '2mm');

        if(initial){ rp.scrollTop = 0; }
        if(!initial){ if(rp.querySelector('#void-purple-'+idx)) {
          var existing = rp.querySelector('#void-purple-'+idx);
          existing.style.background='#723D6B';
          existing.style.padding='1mm';
          existing.querySelectorAll('[id^="child-frame-"]').forEach(function(d){ 
            d.style.background='#723D6B'; 
            d.style.padding='1mm';
          });
          return;
        }}

        rd.querySelectorAll('[id^="void-purple-"],[id^="yellow-"]').forEach(function(el){ el.remove(); });

        var voidMain = rd.createElement('div');
        voidMain.id='void-purple-'+idx;
        voidMain.style.cssText='position:relative;left:-8mm;width:calc(100% + 16mm);min-width:calc(100% + 16mm);height:320mm;min-height:320mm;display:block;border:none;background:#723D6B;box-sizing:border-box;margin:0;margin-top:2mm;padding:1mm;';

        var cf1 = rd.createElement('div');
        cf1.id='child-frame-1-'+idx;
        cf1.style.cssText='width:100%;height:158mm;min-height:158mm;display:block;border:none;background:#723D6B;box-sizing:border-box;margin:0 0 1mm 0;padding:1mm;';

        var cf2 = rd.createElement('div');
        cf2.id='child-frame-2-'+idx;
        cf2.style.cssText='width:100%;height:158mm;min-height:158mm;display:block;border:none;background:#723D6B;box-sizing:border-box;margin:0;padding:1mm;';

        voidMain.appendChild(cf1);
        voidMain.appendChild(cf2);
        rp.appendChild(voidMain);

        redFrame.style.border='none';
        redFrame.style.background='#723D6B';
        force(redFrame, 'background', '#723D6B');
        force(redFrame, 'height', '400mm');
      });
    }catch(e){}
  }
  window.addEventListener('load', function(){
    setTimeout(function(){ fix(true); }, 600);
    setTimeout(function(){ fix(true); }, 1500);
  });
  (function(){
    let fixTimer=null;
    function scheduleFix(isInitial){
      clearTimeout(fixTimer);
      fixTimer=setTimeout(function(){ fix(isInitial); }, 250);
    }
    window.addEventListener('klavar-longmode-changed', function(){ scheduleFix(true); });
    try{
      const mo=new MutationObserver(function(muts){
        for(const m of muts){
          if(m.addedNodes){ for(const n of m.addedNodes){ if(n.tagName==='IFRAME'){ n.addEventListener('load', ()=>scheduleFix(false)); } }
          }
        }
      });
      mo.observe(document.body,{childList:true,subtree:true});
      document.querySelectorAll('#a4-sheet iframe, .a4-extra-page iframe').forEach(f=>f.addEventListener('load', ()=>scheduleFix(false)));
    }catch(e){}
  })();
})();
</script>
